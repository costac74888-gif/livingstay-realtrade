<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>숙박시설 운영자 등록 | 홈앤스테이</title><link rel="stylesheet" href="/static/css/main.css"></head><body>
<header id="siteHeader"></header><main class="search-panel" style="max-width:640px;padding-bottom:48px">
<section class="panel-card" style="background:var(--ink);color:#fff;margin-bottom:14px"><h1 style="margin:0 0 8px;font-size:22px">내 숙박시설을 더 많은 사람에게 알리세요</h1><p style="margin:0;color:#ddd">무료등록 · 사진관리 · 예약링크 · 실거래데이터</p></section>
<section class="panel-card" style="margin-bottom:14px"><h2 class="menu-sec-title">운영자 유형</h2><div id="types" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"></div></section>
<section class="panel-card"><form id="form"><div class="field"><label>사업장명 *</label><input id="biz_name" required></div><div class="field"><label>대표자명 *</label><input id="rep_name" required></div><div class="field"><label>연락처 *</label><input id="phone" required inputmode="tel"></div><div class="field"><label>이메일 (로그인 ID) *</label><input id="email" type="email" required></div><div class="field"><label>비밀번호 *</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>사업자등록번호</label><input id="biz_no"></div><div class="field"><label>영업신고/인허가 번호 *</label><input id="permit_no" required></div><div class="field" id="airbnbField" hidden><label>에어비앤비 리스팅 URL *</label><input id="airbnb_url" placeholder="https://www.airbnb.co.kr/rooms/123"><small id="airbnbHelp"></small><label>추가 리스팅 URL (줄마다 하나)</label><textarea id="airbnb_urls"></textarea></div><div class="field"><label id="bookingLabel">예약 URL (선택)</label><input id="booking_url" type="url" placeholder="https://"><small id="typeGuide"></small></div><div class="field"><label>소개글</label><textarea id="intro_text" maxlength="2000"></textarea></div><label><input id="terms" type="checkbox" required> 이용약관 동의</label><br><label><input id="privacy" type="checkbox" required> 개인정보 수집·이용 동의</label><p id="error" style="color:var(--brick)" role="alert"></p><button class="btn-search" style="width:100%" type="submit">등록 신청</button></form><div id="success" hidden style="text-align:center;padding:24px"><b>신청이 접수되었습니다.</b><p>24시간 내 검토 후 안내드립니다.</p></div></section>
</main><script>
const types={airbnb:['🏠','에어비앤비 호스트'],camping:['⛺','캠핑 운영자'],rural:['🏡','농어촌민박 운영자'],hanok:['🏯','한옥 운영자'],living:['🏢','생숙 운영자']};let selected=new URLSearchParams(location.search).get('type');if(!types[selected])selected='airbnb';const form=document.querySelector('#form'), error=document.querySelector('#error'), success=document.querySelector('#success'), airbnbField=document.querySelector('#airbnbField'), bookingLabel=document.querySelector('#bookingLabel'), airbnbUrl=document.querySelector('#airbnb_url'), airbnbHelp=document.querySelector('#airbnbHelp'),typeGuide=document.querySelector('#typeGuide');
const grid=document.querySelector('#types');function render(){grid.innerHTML=Object.entries(types).map(([k,[i,n]])=>`<button type="button" data-t="${k}" style="text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:${k===selected?'var(--brass-tint)':'#fff'}">${i} <b>${n}</b><br><small id="cnt-${k}">불러오는 중…</small></button>`).join('');grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.t;render();sync();});}function sync(){const air=selected==='airbnb';airbnbField.hidden=!air;bookingLabel.textContent=selected==='living'?'임대 문의 URL (선택)':selected==='camping'?'자체 예약사이트 (선택)':'예약 URL (선택)';typeGuide.textContent=selected==='camping'?'공식 고캠핑 원본과 일치하는 경우에만 미입력 링크를 자동 연결합니다.':selected==='living'?'JnJ PROPERTY 매각 상담도 이용하실 수 있습니다.':'';}render();sync();
fetch('/api/partner/lodging-operator-stats').then(r=>r.json()).then(d=>Object.keys(types).forEach(k=>{let e=document.querySelector('#cnt-'+k);if(e)e.textContent=d.stats[k].label})).catch(()=>{});
airbnbUrl.oninput=()=>{const ok=/^https:\/\/(www\.)?airbnb\.(com|co\.kr)\/rooms\/\d+\/?$/.test(airbnbUrl.value);airbnbHelp.textContent=airbnbUrl.value?(ok?'✓ 올바른 URL':'올바른 에어비앤비 URL 형식이 아닙니다'):'';airbnbHelp.style.color=ok?'#17834b':'var(--brick)'};
form.onsubmit=async e=>{e.preventDefault();error.textContent='';const payload=Object.fromEntries(['biz_name','rep_name','phone','email','password','biz_no','permit_no','booking_url','airbnb_url','intro_text'].map(k=>[k,document.getElementById(k).value.trim()]));payload.airbnb_urls=document.querySelector('#airbnb_urls').value.split('\\n').map(x=>x.trim()).filter(Boolean);payload.terms=document.querySelector('#terms').checked;payload.privacy=document.querySelector('#privacy').checked;payload.lodging_op_type=selected;try{const r=await fetch('/api/apply/lodging-operator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message);form.hidden=true;success.hidden=false}catch(x){error.textContent=x.message||'신청에 실패했습니다.'}};
</script><script src="/static/js/header.js"></script><script src="/static/js/auth.js"></script></body></html>
