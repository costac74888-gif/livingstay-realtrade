<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>직거래 매물 목록 · 홈앤스테이</title>
<meta name="description" content="홈앤스테이 직거래 공개 매물 목록. 숙박시설 매매·전세·월세 직거래 매물을 확인하세요." />
<link rel="icon" href="/static/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css" />
<style>
  /* ── 페이지 레이아웃 ── */
  .listings-page { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
  .listings-title { font-size: 22px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
  .listings-sub   { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }

  /* ── 필터 박스 ── */
  .tx-filter { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; }
  .ls-filter-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr) auto;
    gap: 12px;
    align-items: end;
  }
  .ls-filter-grid .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .ls-filter-grid .field label { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }
  .ls-filter-grid .field select,
  .ls-filter-grid .field input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; font-family: inherit; box-sizing: border-box; background: #fff; color: var(--ink);
  }
  .ls-filter-grid .btn-search {
    background: var(--brass); color: #fff; border: none; border-radius: 8px;
    padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .ls-filter-grid .btn-search:hover { background: var(--brass-dark); }

  /* ── 채팅중 칩 바 ── */
  .tx-favbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-soft);
  }
  .tx-favbar .bar-label { font-weight: 600; color: var(--ink); white-space: nowrap; }
  #lsChatChips { display: flex; gap: 6px; flex-wrap: wrap; overflow-x: auto; }

  /* ── 뷰 탭 ── */
  .ls-view-tabs { display: flex; gap: 6px; margin-bottom: 14px; align-items: center; }
  .ls-view-tabs button {
    padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--line, #ddd);
    background: #fff; color: var(--ink-soft); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .ls-view-tabs button.active {
    border-color: var(--brass, #B4863F); background: var(--brass-tint, #FFF5E0);
    color: var(--brass-dark, #7D4A00);
  }
  .ls-view-tabs .ls-count { margin-left: auto; font-size: 12px; color: var(--ink-soft); }

  /* ── 게시판형(표) ── */
  .ls-board-wrap { overflow-x: auto; }
  .ls-board-tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 540px; }
  .ls-board-tbl thead th {
    text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-soft);
    padding: 6px 8px 8px; border-bottom: 2px solid var(--line); white-space: nowrap;
  }
  .ls-sort-btn {
    display:inline-flex; align-items:center; gap:3px; padding:0; border:0;
    background:transparent; color:inherit; font:inherit; cursor:pointer; white-space:nowrap;
  }
  .ls-sort-btn:hover, .ls-sort-btn.is-active { color:var(--brass-dark, #7D4A00); }
  .ls-sort-arrow { font-size:11px; color:var(--brass, #B4863F); min-width:10px; }
  .ls-board-tbl thead th:last-child { text-align: center; }
  .ls-board-tbl tbody tr { transition: background .1s; }
  .ls-board-tbl tbody tr:hover { background: #fafaf8; }
  .ls-board-tbl td {
    padding: 8px 8px; border-bottom: 1px solid #f0ece3;
    vertical-align: middle;
  }
  .ls-board-tbl tbody tr:last-child td { border-bottom: none; }
  .td-photo { width: 50px; }
  .td-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); vertical-align: middle; }
  .td-thumb-placeholder { width: 44px; height: 44px; border-radius: 6px; background: var(--brass-tint, #FFF5E0); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid var(--line); }
  .td-type   { font-weight: 700; white-space: nowrap; }
  .td-lodging { width: 48px; white-space: nowrap; }
  .td-yield { color: var(--brass-dark, #7D4A00); font-weight: 700; white-space: nowrap; }
  .ls-deal-type-badge {
    display:inline-block; min-width:35px; padding:2px 5px; margin-right:5px;
    border-radius:5px; color:#fff; font-size:10px; line-height:1.25;
    font-weight:800; text-align:center; vertical-align:middle; white-space:nowrap;
  }
  .td-price  { font-weight: 700; color: var(--brass-dark, #7D4A00); white-space: nowrap; }
  .td-area   { font-size: 12.5px; white-space: nowrap; color: var(--ink-soft); }
  .td-date   { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .td-action { text-align: center; white-space: nowrap; }
  .td-bldg   { font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 채팅 / 공유 버튼 ── */
  .listing-chat-btn {
    background: none; border: none; cursor: pointer;
    font-size: 18px; line-height: 1; padding: 2px;
    opacity: .7; transition: opacity .15s; filter: grayscale(1);
  }
  .listing-chat-btn:hover   { opacity: 1; filter: none; }
  .listing-chat-btn.is-chatting { filter: drop-shadow(0 0 3px #B4863F); opacity: 1; }
  .listing-share-btn {
    background: none; border: none; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 2px;
    opacity: .55; transition: opacity .15s;
  }
  .listing-share-btn:hover { opacity: 1; }

  /* ── 카드형(그리드) ── */
  .ls-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .ls-card-item {
    border: 1px solid var(--line); border-radius: 12px;
    background: #fff; overflow: hidden;
    display: flex; flex-direction: column;
    transition: box-shadow .15s;
  }
  .ls-card-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,.10); }
  .ls-card-highlight {
    outline: 3px solid var(--brass, #B4863F);
    outline-offset: 2px;
    animation: lsHighlightPulse 1.8s ease-out;
  }
  @keyframes lsHighlightPulse {
    0%   { background: var(--brass-tint, #FFF5E0); }
    100% { background: transparent; }
  }
  .ls-card-photo {
    width: 100%; aspect-ratio: 16/9; object-fit: cover;
    background: var(--brass-tint, #FFF5E0);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; flex-shrink: 0;
  }
  .ls-card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .ls-card-body { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .ls-card-bldg { font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .ls-card-bldg:hover { color: var(--brass-dark); }
  .ls-card-type { font-size: 12px; color: var(--ink-soft); }
  .ls-card-type .ls-deal-type-badge { margin-right:4px; }
  .ls-card-price { font-size: 15px; font-weight: 800; color: var(--ink); }
  .ls-card-yield { font-size: 12px; color: var(--brass-dark, #7D4A00); font-weight: 700; }
  .ls-card-desc  { font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ls-card-footer {
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; color: var(--ink-soft);
    margin-top: auto; padding-top: 6px;
    border-top: 1px solid var(--line);
  }
  .ls-card-footer .ls-card-date { flex: 1; }
  .ls-card-footer-btn {
    background: none; border: none; cursor: pointer;
    font-size: 15px; padding: 2px 4px; opacity: .65; transition: opacity .15s;
  }
  .ls-card-footer-btn:hover { opacity: 1; }

  /* ── 뷰 전환 CSS ── */
  body.view-board .ls-board-wrap  { display: block; }
  body.view-board .ls-card-grid   { display: none; }
  body.view-card  .ls-board-wrap  { display: none; }
  body.view-card  .ls-card-grid   { display: grid; }

  /* ── 빈 상태 · 로딩 ── */
  .listings-empty   { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 14px; }
  .listings-loading { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; }
  .listings-more {
    display: block; width: 180px; margin: 18px auto 0; padding: 10px 0;
    text-align: center; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13.5px; color: var(--ink-soft); background: #fff; cursor: pointer;
  }
  .listings-more:hover { border-color: var(--brass); color: var(--brass-dark); }
  .ls-notice { font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; line-height: 1.6; }

  /* ── 공유 토스트 ── */
  #lsShareToast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #333; color: #fff; font-size: 13px; padding: 10px 20px;
    border-radius: 24px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 9999;
  }
  #lsShareToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 모바일 반응형 ── */
  @media (max-width: 900px) {
    .ls-filter-grid { grid-template-columns: 1fr 1fr; }
    .ls-filter-grid .btn-search { grid-column: 1 / -1; }
    .ls-card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  }
  @media (max-width: 520px) {
    .listings-page  { padding: 16px 12px 60px; }
    .listings-title { font-size: 18px; }
    .ls-filter-grid { grid-template-columns: 1fr; }
    /* 게시판형 모바일: 전용㎡·최근 수정일·공유 숨김 → [사진|건물명|유형|희망가|채팅] 5열만 노출 */
    .ls-hide-mobile { display: none !important; }
    .ls-board-tbl { min-width: 0; table-layout: fixed; }
    .td-photo { width: 50px; }
    .td-bldg { width: 92px; max-width: 92px; }
    .td-type { width: 42px; }
    .td-price { width: 92px; }
    .td-action { width: 42px; }
    #lsChatChips { flex-wrap: nowrap; }
    .ls-card-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header id="siteHeader"></header>

<div class="listings-page">
  <div class="listings-title">직거래 매물</div>
  <div class="listings-sub">개인이 직접 내놓은 숙박시설 공개 매물입니다.</div>

  <!-- ── 필터 박스 ── -->
  <div class="tx-filter">
    <div class="ls-filter-grid">
      <div class="field">
        <label>시/도</label>
        <select id="lsSido"><option value="">전체</option></select>
      </div>
      <div class="field">
        <label>시/군/구</label>
        <select id="lsSggNm"><option value="">전체</option></select>
      </div>
      <div class="field">
        <label>읍/면/동</label>
        <select id="lsUmdNm"><option value="">전체</option></select>
      </div>
      <div class="field">
        <label>건물명 검색</label>
        <input type="text" id="lsQ" placeholder="예) 오션마크레지던스" />
      </div>
      <div class="field">
        <label>용도</label>
        <select id="lsLodgingType">
          <option value="">전체</option>
          <option value="생활">생활</option>
          <option value="관광">관광</option>
          <option value="일반">일반</option>
          <option value="복합">복합</option>
        </select>
      </div>
      <div class="field">
        <label>거래유형</label>
        <select id="lsDealType">
          <option value="">전체</option>
          <option value="매매">매매</option>
          <option value="전세">전세</option>
          <option value="월세">월세</option>
          <option value="단기임대">단기임대</option>
        </select>
      </div>
      <div class="field">
        <label>검색기간 (최근 수정일)</label>
        <select id="lsDateRange">
          <option value="">전체</option>
          <option value="1month">최근 1개월</option>
          <option value="3months">최근 3개월</option>
        </select>
      </div>
      <button type="button" class="btn-search" id="lsBtnSearch">검색</button>
    </div>

    <!-- 채팅중 칩 바 (로그인 시만 노출) -->
    <div class="tx-favbar" id="lsChatBar" style="display:none;">
      <span class="bar-label">💬 채팅중인 매물</span>
      <div id="lsChatChips"></div>
    </div>
  </div>

  <!-- ── 뷰 탭 ── -->
  <div class="ls-view-tabs">
    <button data-view="board" class="active">📋 게시판형</button>
    <button data-view="card">🖼 카드형</button>
    <span class="ls-count" id="lsTotalCount"></span>
  </div>

  <!-- ── 목록 ── -->
  <div id="listingsContainer">
    <!-- 게시판형 -->
    <div class="ls-board-wrap">
      <table class="ls-board-tbl">
        <thead>
          <tr>
            <th>사진</th>
            <th class="ls-hide-mobile"><button type="button" class="ls-sort-btn" data-sort="lodging" aria-label="용도 정렬">용도 <span class="ls-sort-arrow">↕</span></button></th>
            <th><button type="button" class="ls-sort-btn" data-sort="building" aria-label="건물명 정렬">건물명 <span class="ls-sort-arrow">↕</span></button></th>
            <th><button type="button" class="ls-sort-btn" data-sort="dealType" aria-label="유형 정렬">유형 <span class="ls-sort-arrow">↕</span></button></th>
            <th><button type="button" class="ls-sort-btn" data-sort="price" aria-label="희망가 정렬">희망가(만원) <span class="ls-sort-arrow">↕</span></button></th>
            <th class="ls-hide-mobile"><button type="button" class="ls-sort-btn" data-sort="yield" aria-label="수익률 정렬">수익률 <span class="ls-sort-arrow">↕</span></button></th>
            <th class="ls-hide-mobile"><button type="button" class="ls-sort-btn" data-sort="area" aria-label="전용면적 정렬">전용㎡ <span class="ls-sort-arrow">↕</span></button></th>
            <th class="ls-hide-mobile"><button type="button" class="ls-sort-btn" data-sort="date" aria-label="최근 수정일 정렬">최근 수정일 <span class="ls-sort-arrow">↕</span></button></th>
            <th>채팅</th>
            <th class="ls-hide-mobile">찜</th>
            <th class="ls-hide-mobile">공유</th>
          </tr>
        </thead>
        <tbody id="lsBoardBody">
          <tr><td colspan="11" class="listings-loading">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>
    <!-- 카드형 -->
    <div class="ls-card-grid" id="lsCardGrid" style="display:none;"></div>
  </div>

  <button type="button" id="listingsMore" class="listings-more" style="display:none;">더보기</button>
  <p class="ls-notice">직거래 시 계약 전 등기부등본 확인을 권장합니다. 플랫폼은 거래 당사자가 아닙니다.</p>
</div>

<!-- 공유 토스트 -->
<div id="lsShareToast">링크가 복사되었습니다</div>

<script src="/static/js/format_util.js"></script>
<script src="/static/js/header.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/chat_common.js"></script>
<script>
(function(){
  "use strict";

  // ── 유틸 ──────────────────────────────────────────────────────────────
  function esc(s){ const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
  function fmtN(v){ return v != null ? Number(v).toLocaleString() : "-"; }
  function fmtPrice(deal_type, price_krw, monthly_rent_krw){
    if (typeof window.formatLrPrice === "function")
      return window.formatLrPrice(deal_type, price_krw, monthly_rent_krw);
    if (deal_type === "매매" || deal_type === "전세") return fmtN(price_krw) + "만원";
    if (deal_type === "월세") return "보" + fmtN(price_krw) + "/" + fmtN(monthly_rent_krw) + "만";
    return "-";
  }

  // ── 상태 ──────────────────────────────────────────────────────────────
  const boardBody = document.getElementById("lsBoardBody");
  const cardGrid  = document.getElementById("lsCardGrid");
  const moreBtn   = document.getElementById("listingsMore");
  const countEl   = document.getElementById("lsTotalCount");
  // ── 용도 색상 — main.js 848줄과 동일 값 유지(이중 관리 방지) ──────────
  const LODGING_COLORS = { "생활":"#378ADD", "관광":"#639922", "일반":"#D46BA3", "복합":"#B39DDB", "준공전":"#616161", "미분류":"#E0E0E0" };
  function lodgingLabel(raw){ return (raw && raw.includes("·")) ? "복합" : (raw || "미분류"); }
  function lodgeBadgeHtml(raw){
    const lbl = lodgingLabel(raw);
    const col = LODGING_COLORS[lbl] || LODGING_COLORS["미분류"];
    return `<span style="display:inline-block;font-size:10px;font-weight:700;color:#fff;background:${col};padding:1px 6px;border-radius:4px;margin-right:5px;white-space:nowrap;vertical-align:middle;">${lbl}</span>`;
  }
   const DEAL_TYPE_COLORS = { "매매":"#C85A36", "전세":"#378ADD", "월세":"#639922", "단기임대":"#8B6BB1" };
   function dealTypeBadgeHtml(raw){
     const label = raw || "-";
     const col = DEAL_TYPE_COLORS[label] || "#7B8794";
     return `<span class="ls-deal-type-badge" style="background:${col};">${esc(label)}</span>`;
   }

  const state = { sido:"", sgg_nm:"", umd_nm:"", q:"", deal_type:"", date_range:"", lodging_type:"" };
  let offset = 0;
  const PAGE = 20;
  let loading = false;
  let totalLoaded = 0;

  let myChattingIds = new Set();
  let chatFilterId  = null;
  let boardSortKey = null;
  let boardSortDirection = "asc";

  // ── 뷰 전환 ────────────────────────────────────────────────────────────
  const STORAGE_KEY = "listingsViewMode";
  let currentView = localStorage.getItem(STORAGE_KEY) || "board";

  function setView(mode){
    currentView = mode;
    localStorage.setItem(STORAGE_KEY, mode);
    document.body.classList.remove("view-board", "view-card");
    document.body.classList.add("view-" + mode);
    // 카드형일 때 grid 복원 (초기 display:none 덮어씀)
    if (mode === "card") cardGrid.style.display = "";
    else cardGrid.style.display = "none";
    document.querySelectorAll(".ls-view-tabs button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === mode);
    });
  }

  function findCardItem(listingId){
    return Array.from(cardGrid.querySelectorAll(".ls-card-item"))
      .find(el => String(el.dataset.listingId) === String(listingId)) || null;
  }

  function highlightCardItem(el){
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    // 같은 카드를 연속 클릭해도 애니메이션이 다시 시작되도록 초기화한다.
    el.classList.remove("ls-card-highlight");
    void el.offsetWidth;
    el.classList.add("ls-card-highlight");
    setTimeout(() => el.classList.remove("ls-card-highlight"), 1800);
  }

  // 게시판형 사진에서 진입했을 때 카드형으로 전환하고 대상 카드까지 찾는다.
  // 현재 페이지에 없으면 더보기 페이지를 순차적으로 불러와 긴 목록도 지원한다.
  async function goToCardView(listingId){
    setView("card");
    for (let attempt = 0; attempt < 100; attempt++){
      await new Promise(resolve => requestAnimationFrame(resolve));
      const card = findCardItem(listingId);
      if (card){
        highlightCardItem(card);
        return;
      }
      if (loading){
        await new Promise(resolve => setTimeout(resolve, 50));
        continue;
      }
      if (moreBtn.style.display === "none") return;
      const before = offset;
      await loadListings(false);
      if (offset === before) await new Promise(resolve => setTimeout(resolve, 50));
    }
  }

  document.querySelectorAll(".ls-view-tabs button[data-view]").forEach(btn => {
    btn.addEventListener("click", () => setView(btn.dataset.view));
  });

  function sortBoardRows(){
    if (!boardSortKey) return;
    const rows = Array.from(boardBody.querySelectorAll("tr[data-listing-id]"));
    const keyName = "sort" + boardSortKey.charAt(0).toUpperCase() + boardSortKey.slice(1);
    const numericKeys = new Set(["price", "yield", "area"]);
    rows.sort((a, b) => {
      const av = a.dataset[keyName] || "";
      const bv = b.dataset[keyName] || "";
      const aMissing = av === "";
      const bMissing = bv === "";
      if (aMissing || bMissing) return aMissing === bMissing ? 0 : (aMissing ? 1 : -1);
      let result;
      if (numericKeys.has(boardSortKey)){
        result = Number(av) - Number(bv);
      } else {
        result = av.localeCompare(bv, "ko");
      }
      return boardSortDirection === "asc" ? result : -result;
    });
    rows.forEach(row => boardBody.appendChild(row));
  }

  document.querySelectorAll(".ls-sort-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const nextKey = btn.dataset.sort;
      if (boardSortKey === nextKey) boardSortDirection = boardSortDirection === "asc" ? "desc" : "asc";
      else {
        boardSortKey = nextKey;
        boardSortDirection = "asc";
      }
      document.querySelectorAll(".ls-sort-btn").forEach(other => {
        const active = other === btn;
        other.classList.toggle("is-active", active);
        other.querySelector(".ls-sort-arrow").textContent = active ? (boardSortDirection === "asc" ? "↑" : "↓") : "↕";
        other.closest("th").setAttribute("aria-sort", active ? (boardSortDirection === "asc" ? "ascending" : "descending") : "none");
      });
      sortBoardRows();
    });
  });

  // 초기 뷰 적용
  setView(currentView);

  // ── 공유 ────────────────────────────────────────────────────────────────
  let _toastTimer = null;
  function showToast(msg){
    const el = document.getElementById("lsShareToast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function shareItem(item){
    const url = `${location.origin}/building/${item.building_id}?listing=${item.id}`;
    const title = item.building_name || "직거래 매물";
    const text  = `직거래 매물 - ${item.deal_type || ""} ${fmtPrice(item.deal_type, item.price_krw, item.monthly_rent_krw)}`;
    if (navigator.share){
      navigator.share({ title, text, url }).catch(() => {});
    } else {
      navigator.clipboard.writeText(url).then(
        () => showToast("링크가 복사되었습니다"),
        () => showToast("복사 실패. 주소창에서 직접 복사해주세요.")
      );
    }
  }

  // ── 지역 드롭다운 ───────────────────────────────────────────────────
  let regionTree = {};

  async function loadRegions(){
    try {
      const res = await fetch("/api/regions");
      regionTree = await res.json();
    } catch(e){ return; }
    const selSiDo = document.getElementById("lsSido");
    selSiDo.innerHTML = '<option value="">전체</option>' +
      Object.keys(regionTree).sort().map(sd =>
        `<option value="${esc(sd)}">${esc(sd)}</option>`
      ).join("");
  }

  function refreshSggOptions(){
    const selSgg = document.getElementById("lsSggNm");
    const selUmd = document.getElementById("lsUmdNm");
    const sd = document.getElementById("lsSido").value;
    if (!sd || !regionTree[sd]){
      selSgg.innerHTML = '<option value="">전체</option>';
      selUmd.innerHTML = '<option value="">전체</option>';
      return;
    }
    const sggMap = regionTree[sd].sgg;
    selSgg.innerHTML = '<option value="">전체</option>' +
      Object.keys(sggMap).sort().map(sg =>
        `<option value="${esc(sg)}">${esc(sg)}</option>`
      ).join("");
    selUmd.innerHTML = '<option value="">전체</option>';
  }

  function refreshUmdOptions(){
    const selUmd = document.getElementById("lsUmdNm");
    const sd  = document.getElementById("lsSido").value;
    const sg  = document.getElementById("lsSggNm").value;
    const sgg = regionTree[sd] && regionTree[sd].sgg[sg];
    if (!sgg){ selUmd.innerHTML = '<option value="">전체</option>'; return; }
    selUmd.innerHTML = '<option value="">전체</option>' +
      Object.keys(sgg.umd).sort().map(um =>
        `<option value="${esc(um)}">${esc(um)}</option>`
      ).join("");
  }

  document.getElementById("lsSido").addEventListener("change",  () => refreshSggOptions());
  document.getElementById("lsSggNm").addEventListener("change", () => refreshUmdOptions());

  // ── 채팅중 칩 바 ────────────────────────────────────────────────────
  async function loadMyChatListings(){
    try {
      const res = await fetch("/api/chat/my-listing-ids", { credentials: "same-origin" });
      const d   = await res.json().catch(() => ({}));
      if (!d.ok || !d.items || d.items.length === 0) return;

      myChattingIds = new Set(d.items.map(it => it.listing_request_id));
      const bar   = document.getElementById("lsChatBar");
      const chips = document.getElementById("lsChatChips");
      bar.style.display = "";
      chips.innerHTML = "";

      const allChip = document.createElement("span");
      allChip.className = "fav-chip active";
      allChip.style.cursor = "pointer";
      allChip.textContent = "전체";
      allChip.addEventListener("click", () => {
        chatFilterId = null;
        chips.querySelectorAll(".fav-chip").forEach(c => c.classList.remove("active"));
        allChip.classList.add("active");
        loadListings(true);
      });
      chips.appendChild(allChip);

      d.items.forEach(it => {
        const chip = document.createElement("span");
        chip.className = "fav-chip";
        chip.style.cursor = "pointer";
        const lbl = document.createElement("span");
        lbl.className = "label";
        lbl.textContent = "💬 " + (it.building_name || "(건물명 없음)");
        lbl.title = "이 매물만 보기";
        lbl.addEventListener("click", () => {
          chatFilterId = it.listing_request_id;
          chips.querySelectorAll(".fav-chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          loadListings(true);
        });
        chip.appendChild(lbl);
        chips.appendChild(chip);
      });
    } catch(e){ /* 비로그인 or 오류 무시 */ }
  }

  // ── 채팅방 열기 ─────────────────────────────────────────────────────
  function openChat(listingRequestId){
    return window.LivingstayChat.startListingChat(listingRequestId, function(roomId){
      window.location.href = "/mypage?openChat=" + roomId;
    });
  }

  // ── 썸네일 HTML ─────────────────────────────────────────────────────
  function thumbHtml(photoUrl, isCard){
    if (isCard){
      return photoUrl
        ? `<img src="${esc(photoUrl)}" alt="매물 사진" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='🏠'">`
        : `🏠`;
    }
    return photoUrl
      ? `<img class="td-thumb" src="${esc(photoUrl)}" alt="매물 사진" onerror="this.outerHTML='<span class=td-thumb-placeholder>🏠</span>'">`
      : `<span class="td-thumb-placeholder">🏠</span>`;
  }

  // ── NEW 뱃지 ────────────────────────────────────────────────────────
  const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
  function newBadge(dateStr){
    if (!dateStr) return "";
    const ms = Date.now() - new Date(dateStr + "T00:00:00").getTime();
    if (ms < THREE_DAYS_MS)
      return `<span style="display:inline-block;font-size:9px;font-weight:800;color:#fff;background:#E03333;border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:middle;">NEW</span>`;
    return "";
  }

  // ── 게시판형 행 ─────────────────────────────────────────────────────
  function renderBoardRow(item){
    const tr = document.createElement("tr");
    tr.dataset.listingId = item.id;
    tr.dataset.sortLodging = lodgingLabel(item.lodging_type);
    tr.dataset.sortBuilding = item.building_name || "";
    tr.dataset.sortDealType = item.deal_type || "";
    tr.dataset.sortPrice = item.price_krw != null ? item.price_krw : "";
    tr.dataset.sortYield = item.yield_rate != null ? item.yield_rate : "";
    tr.dataset.sortArea = item.area_sqm != null ? item.area_sqm : "";
    tr.dataset.sortDate = item.listing_date || "";
    const isChatting   = myChattingIds.has(item.id);
    const chatBtnClass = "listing-chat-btn" + (isChatting ? " is-chatting" : "");
    const chatTitle    = isChatting ? "채팅 이어하기" : "문의하기";
    const sqm  = item.area_sqm ? parseFloat(item.area_sqm).toFixed(1) + "㎡" : "-";
    const yld  = item.yield_rate != null ? parseFloat(item.yield_rate).toFixed(1) + "%" : "-";
    const desc = item.description ? (item.description.slice(0, 20) + (item.description.length > 20 ? "…" : "")) : "";
    const bName = esc(item.building_name || "(건물명 없음)");

    tr.innerHTML = `
      <td class="td-photo">${thumbHtml(item.photo_url, false)}</td>
      <td class="td-lodging ls-hide-mobile">${lodgeBadgeHtml(item.lodging_type)}</td>
      <td class="td-bldg" title="${bName}">
        <span class="ls-bldg-link" data-bid="${item.building_id || ""}" style="cursor:pointer;">${bName}${newBadge(item.listing_date)}</span>
      </td>
      <td class="td-type">${dealTypeBadgeHtml(item.deal_type)}</td>
      <td class="td-price">${esc(fmtPrice(item.deal_type, item.price_krw, item.monthly_rent_krw))}</td>
      <td class="td-yield ls-hide-mobile">${esc(yld)}</td>
      <td class="td-area ls-hide-mobile">${esc(sqm)}</td>
      <td class="td-date ls-hide-mobile">${esc(item.listing_date || "")}</td>
      <td class="td-action">
        <button type="button" class="${chatBtnClass}" title="${chatTitle}">💬</button>
      </td>
      <td class="td-action ls-hide-mobile">
        <button type="button" class="listing-like-btn" title="찜">♥ <span class="like-cnt">${item.like_count || 0}</span></button>
      </td>
      <td class="td-action ls-hide-mobile">
        <button type="button" class="listing-share-btn" title="링크 공유">🔗</button>
      </td>`;

    const photoCell = tr.querySelector(".td-photo");
    photoCell.style.cursor = "pointer";
    photoCell.title = "카드형에서 자세히 보기";
    photoCell.addEventListener("click", (e) => {
      e.stopPropagation();
      goToCardView(item.id);
    });
    tr.querySelector(".ls-bldg-link").addEventListener("click", () => {
      if (item.building_id) window.location.href = `/building/${item.building_id}`;
    });
    tr.querySelector(".listing-chat-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      openChat(item.id);
    });
    tr.querySelector(".listing-like-btn").addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        const res = await fetch(`/api/listing-requests/${item.id}/like`, { method:"POST", credentials:"same-origin" });
        const d = await res.json().catch(() => ({}));
        if (res.ok && d.ok) {
          const count = e.currentTarget.querySelector(".like-cnt");
          if (count) count.textContent = d.like_count;
          e.currentTarget.style.color = d.liked ? "var(--brass,#B4863F)" : "var(--ink-soft)";
        }
      } catch (err) {}
    });
    tr.querySelector(".listing-share-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      shareItem(item);
    });
    return tr;
  }

  // ── 카드형 카드 ─────────────────────────────────────────────────────
  function renderCardItem(item){
    const div = document.createElement("div");
    div.className = "ls-card-item";
    div.dataset.listingId = item.id;
    const sqm     = item.area_sqm ? parseFloat(item.area_sqm).toFixed(1) + "㎡" : "";
    const priceStr = fmtPrice(item.deal_type, item.price_krw, item.monthly_rent_krw);
    const yld      = item.yield_rate != null ? parseFloat(item.yield_rate).toFixed(1) + "%" : null;
    const desc     = item.description ? item.description.slice(0, 40) + (item.description.length > 40 ? "…" : "") : null;
    const likeCount = item.like_count || 0;

    div.innerHTML = `
      <div class="ls-card-photo">${thumbHtml(item.photo_url, true)}</div>
      <div class="ls-card-body">
        ${item.listing_number ? `<div style="margin-bottom:3px;"><span style="display:inline-block;font-size:10px;font-weight:700;color:var(--brass-dark,#7D4A00);background:var(--brass-tint,#FFF5E0);border:1px solid var(--brass,#B4863F);border-radius:4px;padding:1px 6px;">${esc(item.listing_number)}</span></div>` : ""}
        <div class="ls-card-bldg ls-bldg-link" data-bid="${item.building_id || ""}">${lodgeBadgeHtml(item.lodging_type)}${esc(item.building_name || "(건물명 없음)")}${newBadge(item.listing_date)}</div>
        <div class="ls-card-type">${dealTypeBadgeHtml(item.deal_type)}${sqm ? " · " + sqm : ""}</div>
        <div class="ls-card-price">${esc(priceStr)}</div>
        ${yld  ? `<div class="ls-card-yield">수익률 ${esc(yld)} <span style="font-size:10px;font-weight:400;">(참고용)</span></div>` : ""}
        ${desc ? `<div class="ls-card-desc">${esc(desc)}</div>` : ""}
        <div class="ls-card-footer">
          <span class="ls-card-date">${esc(item.listing_date || "")}</span>
          <button type="button" class="ls-card-footer-btn listing-like-btn" title="찜">♥ ${likeCount}</button>
          <button type="button" class="ls-card-footer-btn listing-chat-btn${myChattingIds.has(item.id) ? " is-chatting" : ""}" title="문의하기">💬</button>
          <button type="button" class="ls-card-footer-btn listing-share-btn" title="링크 공유">🔗</button>
        </div>
      </div>`;

    div.querySelector(".ls-card-photo").addEventListener("click", (e) => {
      e.stopPropagation();
      highlightCardItem(div);
    });
    div.querySelectorAll(".ls-bldg-link").forEach(el => {
      el.addEventListener("click", () => {
        if (item.building_id) window.location.href = `/building/${item.building_id}`;
      });
    });
    div.querySelector(".listing-chat-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      openChat(item.id);
    });
    div.querySelector(".listing-share-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      shareItem(item);
    });
    div.querySelector(".listing-like-btn").addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        const res = await fetch(`/api/listing-requests/${item.id}/like`, { method:"POST", credentials:"same-origin" });
        const d = await res.json().catch(() => ({}));
        if (res.ok && d.ok) e.currentTarget.textContent = "♥ " + d.like_count;
      } catch(e2){}
    });
    return div;
  }

  // ── 목록 로드 ────────────────────────────────────────────────────────
  async function loadListings(reset){
    if (loading) return;
    loading = true;

    if (reset){
      boardBody.innerHTML = `<tr><td colspan="11" class="listings-loading">불러오는 중…</td></tr>`;
      cardGrid.innerHTML  = `<div class="listings-loading" style="grid-column:1/-1;">불러오는 중…</div>`;
      offset = 0;
      totalLoaded = 0;
      countEl.textContent = "";
    }

    try {
      if (chatFilterId != null){
        const res = await fetch("/api/listings?limit=50&offset=0", { credentials: "same-origin" });
        const d = await res.json().catch(() => ({}));
        const filtered = (d.items || []).filter(it => it.id === chatFilterId);
        boardBody.innerHTML = "";
        cardGrid.innerHTML  = "";
        moreBtn.style.display = "none";
        if (!filtered.length){
           boardBody.innerHTML = `<tr><td colspan="11" class="listings-empty">해당 매물을 찾을 수 없습니다.</td></tr>`;
        } else {
          filtered.forEach(it => { boardBody.appendChild(renderBoardRow(it)); cardGrid.appendChild(renderCardItem(it)); });
        }
        return;
      }

      const params = new URLSearchParams({ limit: PAGE, offset });
      if (state.sido)       params.set("sido",       state.sido);
      if (state.sgg_nm)     params.set("sgg_nm",     state.sgg_nm);
      if (state.umd_nm)     params.set("umd_nm",     state.umd_nm);
      if (state.q)          params.set("q",          state.q);
      if (state.deal_type)    params.set("deal_type",    state.deal_type);
      if (state.date_range)  params.set("date_range",  state.date_range);
      if (state.lodging_type) params.set("lodging_type", state.lodging_type);

      const res = await fetch(`/api/listings?${params}`, { credentials: "same-origin" });
      const d   = await res.json().catch(() => ({}));

      if (!res.ok || !d.ok){
         boardBody.innerHTML = `<tr><td colspan="11" class="listings-empty">불러오기 실패. 새로고침 해주세요.</td></tr>`;
        cardGrid.innerHTML  = `<div class="listings-empty" style="grid-column:1/-1;">불러오기 실패.</div>`;
        return;
      }

      if (reset){ boardBody.innerHTML = ""; cardGrid.innerHTML = ""; }

      if (!d.items || d.items.length === 0){
        if (reset){
           boardBody.innerHTML = `<tr><td colspan="11" class="listings-empty">현재 공개된 직거래 매물이 없습니다.</td></tr>`;
          cardGrid.innerHTML  = `<div class="listings-empty" style="grid-column:1/-1;">현재 공개된 직거래 매물이 없습니다.</div>`;
        }
        moreBtn.style.display = "none";
      } else {
        d.items.forEach(item => {
          boardBody.appendChild(renderBoardRow(item));
          cardGrid.appendChild(renderCardItem(item));
        });
         sortBoardRows();
        offset      += d.items.length;
        totalLoaded += d.items.length;
        countEl.textContent = `총 ${totalLoaded}건${d.has_more ? "+" : ""}`;
        moreBtn.style.display = d.has_more ? "" : "none";
      }
    } catch(e){
      if (reset){
         boardBody.innerHTML = `<tr><td colspan="11" class="listings-empty">오류가 발생했습니다.</td></tr>`;
        cardGrid.innerHTML  = `<div class="listings-empty" style="grid-column:1/-1;">오류가 발생했습니다.</div>`;
      }
    } finally {
      loading = false;
    }
  }

  // ── 검색 버튼 ────────────────────────────────────────────────────────
  document.getElementById("lsBtnSearch").addEventListener("click", () => {
    chatFilterId = null;
    document.querySelectorAll("#lsChatChips .fav-chip").forEach(c => c.classList.remove("active"));
    const allChip = document.querySelector("#lsChatChips .fav-chip");
    if (allChip) allChip.classList.add("active");
    state.sido       = document.getElementById("lsSido").value;
    state.sgg_nm     = document.getElementById("lsSggNm").value;
    state.umd_nm     = document.getElementById("lsUmdNm").value;
    state.q          = document.getElementById("lsQ").value.trim();
    state.deal_type    = document.getElementById("lsDealType").value;
    state.date_range   = document.getElementById("lsDateRange").value;
    state.lodging_type = document.getElementById("lsLodgingType").value;
    loadListings(true);
  });

  document.getElementById("lsQ").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("lsBtnSearch").click();
  });

  moreBtn.addEventListener("click", () => loadListings(false));

  // ── 초기 로드 ────────────────────────────────────────────────────────
  Promise.all([
    loadRegions(),
    loadMyChatListings(),
  ]).then(() => loadListings(true));

})();
</script>
</body>
</html>
