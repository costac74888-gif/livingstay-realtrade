<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>직거래 매물 목록 · 홈앤스테이</title>
<meta name="description" content="홈앤스테이 직거래 공개 매물 목록. 숙박시설 매매·전세·월세 직거래 매물을 확인하세요." />
<link rel="icon" href="/static/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css" />
<style>
  .listings-page { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  .listings-title { font-size: 22px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
  .listings-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
  .listings-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .filter-btn { padding: 6px 14px; border: 1px solid var(--line); border-radius: 20px; background: #fff; font-size: 13px; color: var(--ink-soft); cursor: pointer; transition: all .15s; }
  .filter-btn.active { background: var(--brass); color: #fff; border-color: var(--brass); font-weight: 700; }

  /* 매물 카드 */
  .listing-card {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px;
    margin-bottom: 12px; background: #fff;
  }
  .listing-card-name {
    font-size: 14px; font-weight: 700; color: var(--ink);
    margin-bottom: 8px; cursor: pointer; display: inline-block;
  }
  .listing-card-name:hover { color: var(--brass-dark, #7D4A00); text-decoration: underline; }

  /* 통일 표 */
  .listing-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .listing-tbl th {
    text-align: left; font-size: 11.5px; font-weight: 600;
    color: var(--ink-soft); padding: 0 6px 5px 0;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .listing-tbl th:last-child { text-align: center; }
  .listing-tbl td {
    padding: 6px 6px 6px 0; border-bottom: 1px solid #f0ece3;
    vertical-align: middle; white-space: nowrap;
  }
  .listing-tbl tr:last-child td { border-bottom: none; }
  .listing-tbl td.td-type { font-weight: 700; }
  .listing-tbl td.td-price { font-weight: 700; color: var(--brass-dark, #7D4A00); }
  .listing-tbl td.td-date { font-size: 11.5px; color: var(--ink-soft); }
  .listing-tbl td.td-chat { text-align: center; }
  .listing-chat-btn {
    background: none; border: none; cursor: pointer;
    font-size: 18px; line-height: 1; padding: 2px;
    opacity: .8; transition: opacity .15s;
  }
  .listing-chat-btn:hover { opacity: 1; }

  /* 안내 문구 */
  .listing-card-notice {
    font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; line-height: 1.6;
  }

  /* 빈 상태 */
  .listings-empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 14px; }
  .listings-loading { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; }
  .listings-more { display: block; width: 180px; margin: 18px auto 0; padding: 10px 0; text-align: center; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; color: var(--ink-soft); background: #fff; cursor: pointer; }
  .listings-more:hover { border-color: var(--brass); color: var(--brass-dark); }

  @media (max-width: 600px) {
    .listings-page { padding: 16px 12px 60px; }
    .listings-title { font-size: 18px; }
    .listing-tbl td.td-date { display: none; }
    .listing-tbl th.th-date { display: none; }
  }
</style>
</head>
<body>
<div id="appHeader"></div>
<div class="listings-page">
  <div class="listings-title">직거래 매물</div>
  <div class="listings-sub">개인이 직접 내놓은 숙박시설 공개 매물입니다.</div>

  <div class="listings-filters">
    <button type="button" class="filter-btn active" data-dt="">전체</button>
    <button type="button" class="filter-btn" data-dt="매매">매매</button>
    <button type="button" class="filter-btn" data-dt="전세">전세</button>
    <button type="button" class="filter-btn" data-dt="월세">월세</button>
    <button type="button" class="filter-btn" data-dt="단기임대">단기임대</button>
  </div>

  <div id="listingsContainer">
    <div class="listings-loading">불러오는 중…</div>
  </div>
  <button type="button" id="listingsMore" class="listings-more" style="display:none;">더보기</button>
</div>
<script src="/static/js/header.js"></script>
<script src="/static/js/auth.js"></script>
<script>
(function(){
  "use strict";
  const container = document.getElementById("listingsContainer");
  const moreBtn = document.getElementById("listingsMore");
  let currentDt = "";
  let offset = 0;
  const PAGE = 20;
  let loading = false;

  function esc(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

  // 💬 채팅방 열기
  async function openChat(listingRequestId){
    try {
      const res = await fetch("/api/chat/rooms", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ listing_request_id: listingRequestId }),
      });
      if (res.status === 401){
        if (confirm("채팅을 이용하려면 로그인이 필요합니다.\n로그인 페이지로 이동하시겠습니까?"))
          window.location.href = "/login?next=" + encodeURIComponent(window.location.pathname);
        return;
      }
      const d = await res.json().catch(() => ({}));
      if (res.ok && d.ok){
        alert("채팅방이 준비되었습니다.\n(채팅 화면은 준비 중입니다)");
      } else {
        alert(d.error || "채팅방 생성에 실패했습니다. 잠시 후 다시 시도해주세요.");
      }
    } catch(e){
      alert("오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
    }
  }

  function renderCard(item){
    const card = document.createElement("div");
    card.className = "listing-card";

    // 건물명 (클릭 시 건물상세로)
    const nameEl = document.createElement("div");
    nameEl.className = "listing-card-name";
    nameEl.textContent = item.building_name || "(건물명 없음)";
    nameEl.addEventListener("click", () => {
      if (item.building_id) window.location.href = `/building/${item.building_id}`;
    });
    card.appendChild(nameEl);

    // 표: 유형 | 전용㎡ | 희망가 | 등록일 | 💬
    const sqm = item.area_sqm ? parseFloat(item.area_sqm) + "㎡" : "-";
    const tbl = document.createElement("table");
    tbl.className = "listing-tbl";
    tbl.innerHTML = `
      <thead>
        <tr>
          <th>유형</th>
          <th>전용㎡</th>
          <th>희망가</th>
          <th class="th-date">등록일</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="td-type">${esc(item.deal_type||"-")}</td>
          <td>${esc(sqm)}</td>
          <td class="td-price">${esc(item.desired_price||"미정")}</td>
          <td class="td-date">${esc(item.listing_date||"")}</td>
          <td class="td-chat"><button type="button" class="listing-chat-btn" title="문의하기">💬</button></td>
        </tr>
      </tbody>`;
    tbl.querySelector(".listing-chat-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      openChat(item.id);
    });
    card.appendChild(tbl);

    // 안내 문구
    const notice = document.createElement("div");
    notice.className = "listing-card-notice";
    notice.textContent = "직거래 시 계약 전 등기부등본 확인을 권장합니다.";
    card.appendChild(notice);

    return card;
  }

  async function loadListings(reset){
    if (loading) return;
    loading = true;
    if (reset){ container.innerHTML = `<div class="listings-loading">불러오는 중…</div>`; offset = 0; }
    try {
      const params = new URLSearchParams({ limit: PAGE, offset });
      if (currentDt) params.set("deal_type", currentDt);
      const res = await fetch(`/api/listings?${params}`, { credentials: "same-origin" });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || !d.ok){ container.innerHTML = `<div class="listings-empty">불러오기 실패. 새로고침 해주세요.</div>`; return; }
      if (reset) container.innerHTML = "";
      if (!d.items || d.items.length === 0){
        if (reset) container.innerHTML = `<div class="listings-empty">현재 공개된 직거래 매물이 없습니다.</div>`;
        moreBtn.style.display = "none";
      } else {
        d.items.forEach(item => container.appendChild(renderCard(item)));
        offset += d.items.length;
        moreBtn.style.display = d.has_more ? "" : "none";
      }
    } catch(e){
      if (reset) container.innerHTML = `<div class="listings-empty">오류가 발생했습니다.</div>`;
    } finally { loading = false; }
  }

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentDt = btn.dataset.dt;
      loadListings(true);
    });
  });

  moreBtn.addEventListener("click", () => loadListings(false));

  loadListings(true);
})();
</script>
</body>
</html>
