<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>숙박시설은 홈앤스테이</title>
<meta name="description" content="홈앤스테이 공지사항." />
<link rel="icon" href="/static/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>

<header id="siteHeader"></header>

<div class="search-panel" style="max-width:640px; padding-bottom:40px;">

  <div class="panel-card">
    <h1 style="font-size:20px; font-weight:700; color:var(--ink); margin:0 0 16px;">공지사항</h1>
    <div class="notice-tab-bar" role="tablist" aria-label="공지사항 분류">
      <button class="ntab on" type="button" role="tab" aria-selected="true" data-tab="notice">📢 공지</button>
      <button class="ntab" type="button" role="tab" aria-selected="false" data-tab="news">📰 뉴스</button>
      <button class="ntab" type="button" role="tab" aria-selected="false" data-tab="data">📂 자료</button>
      <button class="ntab" type="button" role="tab" aria-selected="false" data-tab="agency">🔗 유관기관</button>
    </div>
    <div id="noticeList">
      <div style="text-align:center; padding:48px 12px; color:var(--ink-soft); font-size:14px;">불러오는 중…</div>
    </div>
  </div>
</div>

<style>
  .notice-item { border-bottom:1px solid var(--line, #e8eaed); }
  .notice-item:last-child { border-bottom:none; }
  .notice-head {
    display:flex; align-items:center; gap:8px; width:100%;
    padding:16px 4px; background:none; border:none; cursor:pointer; text-align:left;
    font-family:inherit;
  }
  .notice-head:hover .notice-title { color:var(--brass, #B4863F); }
  .notice-pin {
    flex:none; font-size:11px; font-weight:700; color:#fff; background:var(--brass, #B4863F);
    border-radius:4px; padding:2px 6px;
  }
  .notice-title { flex:1; font-size:15px; font-weight:600; color:var(--ink); }
  .notice-date { flex:none; font-size:12px; color:var(--ink-soft); }
  .notice-arrow { flex:none; font-size:12px; color:var(--ink-soft); transition:transform .15s; }
  .notice-item.open .notice-arrow { transform:rotate(180deg); }
  .notice-body {
    display:none; padding:0 4px 18px; font-size:14px; line-height:1.7;
    color:var(--ink); white-space:pre-wrap; word-break:break-word;
  }
  .notice-item.open .notice-body { display:block; }
  .notice-empty { text-align:center; padding:48px 12px; color:var(--ink-soft); }
  .notice-tab-bar { display:flex; gap:4px; margin-bottom:16px; border-bottom:2px solid var(--line); }
  .ntab {
    flex:1; padding:9px 4px; font-size:13px; font-weight:600; border:none;
    background:none; cursor:pointer; color:var(--ink-soft); border-bottom:2px solid transparent;
    margin-bottom:-2px; font-family:inherit; transition:color .15s,border-color .15s;
  }
  .ntab.on { color:var(--brass-dark,#8a6a2f); border-bottom-color:var(--brass,#B4863F); }
  .ntab:hover { color:var(--ink); }
  .ntab:focus-visible, .agency-card:focus-visible, .notice-news-item:focus-visible,
  .notice-data-item:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }
  .notice-news-item, .notice-data-item {
    display:flex; align-items:flex-start; gap:10px; padding:14px 4px;
    border-bottom:1px solid var(--line); text-decoration:none; color:inherit;
  }
  .notice-news-item:hover .notice-title, .notice-data-item:hover .notice-title { color:var(--brass); }
  .notice-news-dot { width:6px; height:6px; border-radius:50%; background:var(--brass); flex:none; margin-top:7px; }
  .notice-data-icon { font-size:22px; flex:none; }
  .notice-summary { font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:3px; }
  .notice-meta { font-size:11px; color:var(--ink-muted); margin-top:4px; }
  .agency-intro { font-size:12px; color:var(--ink-soft); margin:0 0 12px; }
  .agency-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:4px 0; }
  .agency-card {
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 10px;
    border-radius:10px; border:1px solid var(--line); background:#fff;
    text-decoration:none; color:var(--ink); transition:border-color .15s,box-shadow .15s;
  }
  .agency-card:hover { border-color:var(--brass); box-shadow:0 2px 8px rgba(180,134,63,.15); }
  .agency-card img { height:32px; max-width:100%; object-fit:contain; }
  .agency-card-icon { font-size:28px; line-height:32px; }
  .agency-card-name { font-size:12px; font-weight:700; text-align:center; }
  .agency-card-url { max-width:100%; font-size:10px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media(min-width:480px){ .agency-grid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width: 520px){
    /* 좁은 폰: 제목이 길어도 날짜/화살표가 짓눌리지 않게 줄바꿈 허용 */
    .notice-head { flex-wrap:wrap; gap:4px 8px; }
    .notice-title { flex:1 1 100%; order:1; font-size:14.5px; }
    .notice-pin { order:0; }
    .notice-date { order:2; }
    .notice-arrow { order:3; margin-left:auto; }
  }
  .notice-attachment-link {
    display:inline-block; font-size:13px; font-weight:600;
    color:var(--brass, #B4863F); text-decoration:none;
  }
  .notice-attachment-link:hover { text-decoration:underline; }
</style>

<script>
  function escapeHtml(v){
    return String(v ?? "").replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
    ));
  }

  function linkify(escapedText){
    return escapedText.replace(
      /(https?:\/\/[^\s<]+)/g,
      (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
    );
  }

  const TAB_LABELS = {notice:"공지사항",news:"뉴스",data:"자료",agency:"유관기관"};
  let currentTab = "notice";
  let loadSeq = 0;

  function safeHttpUrl(value){
    try {
      const url = new URL(String(value || ""), location.origin);
      return (url.protocol === "http:" || url.protocol === "https:") ? url.href : "";
    } catch (_) { return ""; }
  }

  function renderEmpty(tab){
    const label = TAB_LABELS[tab] || "항목";
    return `
      <div class="notice-empty">
        <div style="font-size:40px; margin-bottom:12px;">📭</div>
        <div style="font-size:15px; font-weight:600; color:var(--ink);">등록된 ${escapeHtml(label)}이 없습니다.</div>
      </div>`;
  }

  function noticeItemHtml(n){
    const pin = n.is_pinned ? `<span class="notice-pin">고정</span>` : "";
    return `
      <div class="notice-item">
        <button class="notice-head" type="button">
          ${pin}
          <span class="notice-title">${escapeHtml(n.title)}</span>
          <span class="notice-date">${escapeHtml(n.created_at || "")}</span>
          <span class="notice-arrow">▾</span>
        </button>
        <div class="notice-body">${linkify(escapeHtml(n.body))}</div>
        ${n.attachment_url ? `<div style="padding:0 4px 18px;"><a href="${n.attachment_url}" target="_blank" rel="noopener" class="notice-attachment-link">📎 첨부파일(PDF) 다운로드</a></div>` : ""}
      </div>`;
  }

  function newsItemHtml(n){
    const href = safeHttpUrl(n.external_url);
    const content = `<span class="notice-news-dot"></span><span style="flex:1;min-width:0;">
      <span class="notice-title" style="display:block;">${escapeHtml(n.title)}</span>
      ${n.summary ? `<span class="notice-summary" style="display:block;">${escapeHtml(n.summary)}</span>` : ""}
      <span class="notice-meta" style="display:block;">${escapeHtml(n.created_at || "")}${href ? " · 외부링크 ↗" : ""}</span>
    </span>`;
    return href
      ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" class="notice-news-item">${content}</a>`
      : `<div class="notice-news-item">${content}</div>`;
  }

  function dataItemHtml(n){
    const external = safeHttpUrl(n.external_url);
    const href = n.attachment_url || external;
    const content = `<span class="notice-data-icon">${n.attachment_url ? "📎" : "📄"}</span>
      <span style="flex:1;min-width:0;"><span class="notice-title" style="display:block;">${escapeHtml(n.title)}</span>
      ${n.summary ? `<span class="notice-summary" style="display:block;">${escapeHtml(n.summary)}</span>` : ""}
      <span class="notice-meta" style="display:block;">${escapeHtml(n.created_at || "")}${n.attachment_url ? " · PDF 다운로드" : external ? " · 외부링크 ↗" : ""}</span></span>`;
    return href
      ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" class="notice-data-item">${content}</a>`
      : `<div class="notice-data-item">${content}</div>`;
  }

  async function loadAgencyTab(wrap, seq){
    const res = await fetch("/api/agency-links");
    if (!res.ok) throw new Error("fetch failed");
    const data = await res.json();
    if (seq !== loadSeq) return;
    const links = (data.links || []).map((link) => ({...link, safe_url:safeHttpUrl(link.link_url)}))
      .filter((link) => link.safe_url);
    if (!links.length){ wrap.innerHTML = renderEmpty("agency"); return; }
    wrap.innerHTML = `<p class="agency-intro">숙박부동산 관련 정부·공공기관 사이트 모음입니다.</p>
      <div class="agency-grid">${links.map((link) => {
        const host = new URL(link.safe_url).hostname;
        return `<a href="${escapeHtml(link.safe_url)}" target="_blank" rel="noopener noreferrer" class="agency-card">
          ${link.logo_url ? `<img src="${escapeHtml(link.logo_url)}" alt="" loading="lazy">` : `<span class="agency-card-icon" aria-hidden="true">🏛️</span>`}
          <span class="agency-card-name">${escapeHtml(link.name)}</span>
          <span class="agency-card-url">${escapeHtml(host)}</span>
        </a>`;
      }).join("")}</div>`;
  }

  async function loadNoticeTab(tab){
    const wrap = document.getElementById("noticeList");
    const seq = ++loadSeq;
    wrap.innerHTML = `<div class="notice-empty">불러오는 중…</div>`;
    try {
      if (tab === "agency"){ await loadAgencyTab(wrap, seq); return; }
      const res = await fetch(`/api/notices?category=${encodeURIComponent(tab)}&size=100`);
      if (!res.ok) throw new Error("fetch failed");
      const data = await res.json();
      if (seq !== loadSeq) return;
      const items = (data && data.items) || [];
      if (!items.length){ wrap.innerHTML = renderEmpty(tab); return; }
      if (tab === "notice"){
        wrap.innerHTML = items.map(noticeItemHtml).join("");
        wrap.querySelectorAll(".notice-head").forEach((btn) => {
          btn.addEventListener("click", () => btn.parentElement.classList.toggle("open"));
        });
      } else if (tab === "news"){
        wrap.innerHTML = items.map(newsItemHtml).join("");
      } else {
        wrap.innerHTML = items.map(dataItemHtml).join("");
      }
    } catch (e) {
      if (seq === loadSeq) wrap.innerHTML = `<div class="notice-empty">불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>`;
    }
  }

  function switchNoticeTab(tab, {replaceHistory=false} = {}){
    if (!["notice","news","data","agency"].includes(tab)) tab = "notice";
    currentTab = tab;
    document.querySelectorAll(".ntab").forEach((button) => {
      const active = button.dataset.tab === tab;
      button.classList.toggle("on", active);
      button.setAttribute("aria-selected", String(active));
    });
    const url = new URL(location.href);
    if (tab === "notice") url.searchParams.delete("tab"); else url.searchParams.set("tab", tab);
    history[replaceHistory ? "replaceState" : "pushState"]({}, "", url);
    loadNoticeTab(tab);
  }

  document.querySelectorAll(".ntab").forEach((button) => {
    button.addEventListener("click", () => switchNoticeTab(button.dataset.tab));
  });
  window.addEventListener("popstate", () => switchNoticeTab(new URLSearchParams(location.search).get("tab") || "notice", {replaceHistory:true}));
  switchNoticeTab(new URLSearchParams(location.search).get("tab") || "notice", {replaceHistory:true});
</script>
<script>window.PAGE_TITLE = "공지사항";</script>
<script src="/static/js/header.js"></script>
<script src="/static/js/auth.js"></script>

</body>
</html>
