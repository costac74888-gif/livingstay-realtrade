<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숙박 운영자 관리</title><link rel="stylesheet" href="/static/css/main.css"></head><body><header id="siteHeader"></header><main class="search-panel" style="max-width:640px"><section class="panel-card"><h1>숙박 운영자 정보 관리</h1><p id="notice">불러오는 중…</p><form id="f" hidden><div class="field"><label>예약 URL</label><input id="booking_url"></div><div class="field"><label>에어비앤비 URL</label><input id="airbnb_url"></div><div class="field"><label>추가 에어비앤비 URL (줄마다 하나)</label><textarea id="airbnb_urls"></textarea></div><div class="field"><label>소개글</label><textarea id="intro_text"></textarea></div><div class="field"><label>대표 사진</label><input id="photo" type="file" accept="image/png,image/jpeg"><img id="preview" alt="" style="max-width:120px;display:block;margin-top:8px"></div><button class="btn-search" style="width:100%">저장</button></form></section></main><script>const f=document.querySelector('#f'),n=document.querySelector('#notice');fetch('/api/lodging-operator/me').then(r=>r.json()).then(d=>{if(!d.ok)throw Error(d.message);const x=d.item;['booking_url','airbnb_url','intro_text'].forEach(k=>document.querySelector('#'+k).value=x[k]||'');airbnb_urls.value=(x.airbnb_urls||[]).join('\\n');preview.src=x.photo_src||'';n.textContent=x.biz_name;f.hidden=false}).catch(e=>n.textContent=e.message);f.onsubmit=async e=>{e.preventDefault();let d={booking_url:booking_url.value,airbnb_url:airbnb_url.value,intro_text:intro_text.value,airbnb_urls:airbnb_urls.value.split('\\n').map(x=>x.trim()).filter(Boolean)};let r=await fetch('/api/lodging-operator/me',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)alert((await r.json()).message);const file=photo.files[0];if(file){let fd=new FormData;fd.append('file',file);r=await fetch('/api/lodging-operator/photo',{method:'POST',body:fd});const p=await r.json();if(p.ok)preview.src=p.photo_src;else alert(p.message)}alert('저장되었습니다.');};</script><script src="/static/js/header.js"></script></body></html>
