<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숙박 운영자 관리</title><link rel="stylesheet" href="/static/css/main.css"><style>
.manage-wrap{max-width:720px}.manage-wrap h1{margin:0 0 8px}.manage-lead{color:var(--ink-soft);font-size:13px;line-height:1.6}.manage-section{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}.manage-section h2{font-size:14px;margin:0 0 12px}.manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.manage-grid .field{margin:0}.manage-help{font-size:11px;color:var(--ink-soft);line-height:1.5}.amenity-picker{display:flex;flex-wrap:wrap;gap:7px}.amenity-toggle{display:inline-flex;align-items:center;gap:5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink-soft);font:inherit;font-size:11px;cursor:pointer}.amenity-toggle.is-on{border-color:#b9d9cd;background:#edf7f2;color:#1d765c;font-weight:700}.readonly-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readonly-facts div{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#f8f9fa}.readonly-facts small{display:block;color:var(--ink-soft);font-size:10px}.readonly-facts b{font-size:13px}.badge-row{display:flex;flex-direction:column;gap:8px}.badge-row label{display:flex;gap:8px;align-items:center;font-size:12px}.claim-box{margin-top:12px;padding:12px;border:1px solid #e5d5b6;border-radius:9px;background:var(--brass-tint)}.claim-box p{margin:0 0 9px;font-size:11px;line-height:1.5;color:var(--ink-soft)}.claim-box input,.claim-box textarea{width:100%;margin-top:7px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.gallery-item{border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:6px}.gallery-item img{display:block;width:100%;height:92px;object-fit:cover;border-radius:5px}.gallery-actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.gallery-actions button{font-size:11px;padding:4px 6px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}.gallery-item.primary{border:2px solid var(--brass)}@media(max-width:600px){.manage-grid,.readonly-facts{grid-template-columns:1fr}}
</style></head><body><header id="siteHeader"></header><main class="search-panel manage-wrap" style="padding-bottom:42px"><section class="panel-card"><h1>숙박 운영자 정보 관리</h1><p id="notice" class="manage-lead">불러오는 중…</p><div id="applyAction" hidden style="margin-top:22px"><a id="applyLink" class="btn-search" style="display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none" href="/apply/lodging-operator">운영자 등록 신청</a></div>
<form id="f" hidden>
<div class="op-note" id="profileInfo" style="font-size:13px;color:var(--ink-soft);margin-bottom:14px"></div>
<section class="manage-section"><h2>예약·연락처</h2><div class="manage-grid"><div class="field"><label for="homepage_url">시설 홈페이지 URL</label><input id="homepage_url" type="url" placeholder="https://example.com"></div><div class="field"><label for="facility_phone">대표 전화번호</label><input id="facility_phone" type="tel" inputmode="tel" placeholder="02-0000-0000"></div><div class="field"><label for="booking_url">예약 사이트 URL</label><input id="booking_url" type="url" placeholder="https://example.com/reservation"></div><div class="field"><label for="airbnb_url">에어비앤비 리스팅 URL</label><input id="airbnb_url" type="url" placeholder="https://www.airbnb.co.kr/rooms/12345678"></div></div><label class="field" style="display:block;margin-top:12px"><span>추가 에어비앤비 리스팅 URL</span><textarea id="airbnb_urls" placeholder="주소를 줄마다 입력"></textarea></label><p class="manage-help">공개 페이지에는 안전한 HTTPS 예약·홈페이지 주소와 운영자 전화번호만 표시됩니다.</p></section>
<section class="manage-section"><h2>편의시설</h2><p class="manage-help">실제로 제공하는 시설만 선택해 주세요.</p><div id="amenityPicker" class="amenity-picker"></div></section>
<section class="manage-section"><h2>인증·선정 표시</h2><p class="manage-help">실제로 보유하거나 선정된 항목만 선택해 주세요. 선택한 내용은 운영자 직접 등록 정보로 표시됩니다.</p><div id="badgePicker" class="badge-row"></div></section>
<section class="manage-section"><h2>영업신고 데이터 <span class="manage-help">읽기 전용 · 수정 불가</span></h2><div id="readonlyFacts" class="readonly-facts"></div></section>
<section class="manage-section"><h2>시설 소개</h2><textarea id="intro_text" maxlength="500" placeholder="시설의 특징과 이용 안내를 500자 이내로 작성해 주세요"></textarea><div id="specialFields"></div></section><button class="btn-search" style="width:100%;margin-top:20px">프로필 저장</button></form>
<section id="gallerySection" hidden class="manage-section"><h2>시설 사진 <span id="photoCount" class="manage-help"></span></h2><p class="manage-help">최대 10장 · JPG 또는 PNG. 대표 사진은 시설 페이지에 먼저 표시됩니다.</p><input id="photoUpload" type="file" accept="image/png,image/jpeg" multiple><p id="galleryMsg" class="manage-help"></p><div id="gallery" class="gallery"></div></section></section></main>
<script>
const f=document.querySelector("#f"),n=document.querySelector("#notice"),applyAction=document.querySelector("#applyAction"),applyLink=document.querySelector("#applyLink"),gallery=document.querySelector("#gallery"),galleryMsg=document.querySelector("#galleryMsg"),params=new URLSearchParams(location.search),requestedType=params.get("type"),requestedBuilding=params.get("building_id"),allowedTypes=new Set(["airbnb","camping","rural","hanok","living"]);if(allowedTypes.has(requestedType)){applyLink.href=`/apply/lodging-operator?type=${requestedType}`;if(requestedBuilding&&/^\d+$/.test(requestedBuilding))applyLink.href+=`&building_id=${requestedBuilding}`}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(url,opts){const r=await fetch(url,opts),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||"요청에 실패했습니다.");return d}
const amenities=["와이파이","주차","에어컨","TV","세탁기","조식","전기","온수","바베큐","반려동물","수영장","산책로","낚시","텃밭","사우나","냉장고","전자레인지","장애인편의","외국어안내","금연"],defaultBadgeOptions=[{code:"tourism_quality",label:"한국관광 품질인증"},{code:"airbnb_guest_favorite",label:"에어비앤비 게스트 선호"},{code:"exemplary_business",label:"모범업소"},{code:"kta_certified",label:"한국관광공사 인증"}];let badgeOptions=defaultBadgeOptions,photos=[],current=null;
function renderChoices(){document.querySelector("#amenityPicker").innerHTML=amenities.map(x=>`<button type="button" class="amenity-toggle" data-amenity="${esc(x)}">${esc(x)}</button>`).join("");document.querySelector("#badgePicker").innerHTML=badgeOptions.map(x=>`<label><input type="checkbox" value="${esc(x.code)}"> ${esc(x.label)}</label>`).join("");document.querySelectorAll(".amenity-toggle").forEach(b=>b.onclick=()=>b.classList.toggle("is-on"))}
function renderReadonly(x){const vals=[["신고 객실수",x.lr_room_count,"실"],["시설면적",x.lr_facility_area,"㎡"],["신고 전화번호",x.lr_phone,""],["양실",x.lr_western_rooms,"실"],["한실",x.lr_korean_rooms,"실"],["화장실수",x.lr_toilet_count,"개"]];document.querySelector("#readonlyFacts").innerHTML=vals.filter(([,v])=>v!=null&&v!=="").map(([k,v,u])=>`<div><small>${k}</small><b>${esc(v)}${u}</b></div>`).join("")||"<p class='manage-help'>연결된 신고 데이터가 없습니다.</p>"}
async function loadPhotos(){const d=await api("/api/lodging-operator/photos");photos=d.items||d.photos||[];document.querySelector("#photoCount").textContent=`${photos.length}/10`;gallery.innerHTML=photos.map((p,i)=>`<div class="gallery-item ${p.is_primary||p.primary?"primary":""}"><img src="${esc(p.photo_src||p.url||p.src)}" alt="시설 사진 ${i+1}"><div class="gallery-actions">${p.is_primary||p.primary?"<b>대표</b>":`<button data-primary="${p.id}">대표로</button>`}<button data-delete="${p.id}">삭제</button></div></div>`).join("");gallery.querySelectorAll("button").forEach(b=>b.onclick=async()=>{try{if(b.dataset.primary)await api(`/api/lodging-operator/photos/${b.dataset.primary}/primary`,{method:"PUT"});else if(confirm("이 사진을 삭제할까요?"))await api(`/api/lodging-operator/photos/${b.dataset.delete}`,{method:"DELETE"});await loadPhotos()}catch(e){galleryMsg.textContent=e.message}})}
fetch("/api/lodging-operator/me").then(r=>r.json()).then(async d=>{if(!d.ok)throw Error(d.message);const x=current=d.item||{};badgeOptions=Array.isArray(x.badge_options)&&x.badge_options.length?x.badge_options:defaultBadgeOptions;renderChoices();["booking_url","airbnb_url","intro_text","facility_phone","homepage_url"].forEach(k=>{const el=document.querySelector("#"+k);if(el)el.value=x[k]||""});airbnb_urls.value=(x.airbnb_urls||[]).join("\n");renderReadonly(x);const selected=x.amenities||[];document.querySelectorAll(".amenity-toggle").forEach(b=>b.classList.toggle("is-on",selected.includes(b.dataset.amenity)));(x.badges||[]).forEach(code=>{const cb=[...document.querySelectorAll("#badgePicker input")].find(i=>i.value===code);if(cb)cb.checked=true});profileInfo.textContent=[x.biz_name,x.rep_name,x.phone].filter(Boolean).join(" · ");n.textContent="현재 운영자 프로필을 수정할 수 있습니다.";f.hidden=false;gallerySection.hidden=false;await loadPhotos()}).catch(e=>{n.textContent=e.message||"운영자 정보를 불러올 수 없습니다.";applyAction.hidden=false});
f.onsubmit=async e=>{e.preventDefault();try{const selectedBadges=[...document.querySelectorAll("#badgePicker input:checked")].map(x=>x.value);await api("/api/lodging-operator/me",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({booking_url:booking_url.value.trim(),airbnb_url:airbnb_url.value.trim(),airbnb_urls:airbnb_urls.value.split("\n").map(x=>x.trim()).filter(Boolean),homepage_url:homepage_url.value.trim(),facility_phone:facility_phone.value.trim(),intro_text:intro_text.value.trim(),amenities:[...document.querySelectorAll(".amenity-toggle.is-on")].map(x=>x.dataset.amenity),badges:selectedBadges})});alert("저장되었습니다.")}catch(e){alert(e.message)}};
photoUpload.onchange=async()=>{for(const file of [...photoUpload.files]){const fd=new FormData();fd.append("file",file);try{await api("/api/lodging-operator/photos",{method:"POST",body:fd})}catch(e){galleryMsg.textContent=e.message}}photoUpload.value="";await loadPhotos()};</script><script src="/static/js/header.js"></script></body></html>
