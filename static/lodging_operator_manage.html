<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숙박 운영자 관리</title><link rel="stylesheet" href="/static/css/main.css"></head><body><header id="siteHeader"></header><main class="search-panel" style="max-width:640px"><section class="panel-card"><h1>숙박 운영자 정보 관리</h1><p id="notice">불러오는 중…</p><div id="applyAction" hidden style="margin-top:22px"><a id="applyLink" class="btn-search" style="display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none" href="/apply/lodging-operator">운영자 등록 신청</a></div><form id="f" hidden><div class="field"><label for="booking_url">예약 사이트 URL</label><small>입력하면 건물 상세페이지 사진 아래 ‘예약 사이트 바로가기’ 버튼이 활성화됩니다.</small><input id="booking_url" type="url" placeholder="https://example.com/reservation"></div><div class="field"><label for="airbnb_url">에어비앤비 리스팅 URL</label><small>airbnb.co.kr/rooms/숫자 형태로 입력해 주세요.</small><input id="airbnb_url" type="url" placeholder="https://www.airbnb.co.kr/rooms/12345678"></div><div class="field"><label for="airbnb_urls">추가 에어비앤비 리스팅 URL</label><small>숙소가 여러 개라면 한 줄에 주소 하나씩 입력하세요.</small><textarea id="airbnb_urls" placeholder="주소를 줄마다 입력"></textarea></div><div class="field"><label for="intro_text">운영자 소개</label><textarea id="intro_text"></textarea></div><div class="field"><label for="photo">대표 사진</label><input id="photo" type="file" accept="image/png,image/jpeg"><img id="preview" alt="대표 사진 미리보기" style="max-width:120px;display:block;margin-top:8px"></div><button class="btn-search" style="width:100%">저장</button></form></section></main><script>const f=document.querySelector('#f'),n=document.querySelector('#notice'),applyAction=document.querySelector('#applyAction'),applyLink=document.querySelector('#applyLink');const requestedType=new URLSearchParams(location.search).get('type');const allowedTypes=new Set(['airbnb','camping','rural','hanok','living']);if(allowedTypes.has(requestedType))applyLink.href=`/apply/lodging-operator?type=${requestedType}`;fetch('/api/lodging-operator/me').then(r=>r.json()).then(d=>{if(!d.ok)throw Error(d.message);const x=d.item;['booking_url','airbnb_url','intro_text'].forEach(k=>document.querySelector('#'+k).value=x[k]||'');airbnb_urls.value=(x.airbnb_urls||[]).join('\\n');preview.src=x.photo_src||'';n.textContent=x.biz_name;f.hidden=false}).catch(e=>{n.textContent=e.message;applyAction.hidden=false});f.onsubmit=async e=>{e.preventDefault();let d={booking_url:booking_url.value,airbnb_url:airbnb_url.value,intro_text:intro_text.value,airbnb_urls:airbnb_urls.value.split('\\n').map(x=>x.trim()).filter(Boolean)};let r=await fetch('/api/lodging-operator/me',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)alert((await r.json()).message);const file=photo.files[0];if(file){let fd=new FormData;fd.append('file',file);r=await fetch('/api/lodging-operator/photo',{method:'POST',body:fd});const p=await r.json();if(p.ok)preview.src=p.photo_src;else alert(p.message)}alert('저장되었습니다.');};</script><script src="/static/js/header.js"></script></body></html>
