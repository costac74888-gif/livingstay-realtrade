<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숙박 운영자 관리</title><link rel="stylesheet" href="/static/css/main.css"><style>.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.gallery-item{border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:6px}.gallery-item img{display:block;width:100%;height:92px;object-fit:cover;border-radius:5px}.gallery-actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.gallery-actions button{font-size:11px;padding:4px 6px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}.gallery-item.primary{border:2px solid var(--brass)}</style></head><body><header id="siteHeader"></header><main class="search-panel" style="max-width:680px;padding-bottom:42px"><section class="panel-card"><h1>숙박 운영자 정보 관리</h1><p id="notice">불러오는 중…</p><div id="applyAction" hidden style="margin-top:22px"><a id="applyLink" class="btn-search" style="display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none" href="/apply/lodging-operator">운영자 등록 신청</a></div><form id="f" hidden><div class="op-note" id="profileInfo" style="font-size:13px;color:var(--ink-soft);margin-bottom:14px"></div><div class="field"><label for="booking_url">예약 사이트 URL</label><input id="booking_url" type="url" placeholder="https://example.com/reservation"></div><div class="field"><label for="airbnb_url">에어비앤비 리스팅 URL</label><input id="airbnb_url" type="url" placeholder="https://www.airbnb.co.kr/rooms/12345678"></div><div class="field"><label for="airbnb_urls">추가 에어비앤비 리스팅 URL</label><textarea id="airbnb_urls" placeholder="주소를 줄마다 입력"></textarea></div><div class="field"><label for="intro_text">운영자 소개</label><textarea id="intro_text" maxlength="2000"></textarea></div><button class="btn-search" style="width:100%">프로필 저장</button></form><section id="gallerySection" hidden style="margin-top:24px;border-top:1px solid var(--line);padding-top:18px"><h2 class="menu-sec-title">시설 사진 <span id="photoCount" style="font-size:12px;color:var(--ink-soft)"></span></h2><p style="font-size:12px;color:var(--ink-soft)">최대 10장 · JPG 또는 PNG. 대표 사진은 시설 페이지에 먼저 표시됩니다.</p><input id="photoUpload" type="file" accept="image/png,image/jpeg" multiple><p id="galleryMsg" style="font-size:12px"></p><div id="gallery" class="gallery"></div></section></section></main><script>
const f=document.querySelector('#f'),n=document.querySelector('#notice'),applyAction=document.querySelector('#applyAction'),applyLink=document.querySelector('#applyLink'),gallery=document.querySelector("#gallery"),galleryMsg=document.querySelector("#galleryMsg");const params=new URLSearchParams(location.search),requestedType=params.get('type'),requestedBuilding=params.get("building_id"),allowedTypes=new Set(['airbnb','camping','rural','hanok','living']);if(allowedTypes.has(requestedType)){applyLink.href=`/apply/lodging-operator?type=${requestedType}`;if(requestedBuilding&&/^\d+$/.test(requestedBuilding))applyLink.href+=`&building_id=${requestedBuilding}`};let photos=[];
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||"요청에 실패했습니다.");return d}
function renderPhotos(){document.querySelector("#photoCount").textContent=`${photos.length}/10`;gallery.innerHTML=photos.map((p,i)=>`<div class="gallery-item ${p.is_primary||p.primary?"primary":""}"><img src="${esc(p.photo_src||p.url||p.src)}" alt="시설 사진 ${i+1}"><div class="gallery-actions">${p.is_primary||p.primary?"<b style=\"font-size:11px;color:var(--brass-dark)\">대표</b>":`<button data-primary="${p.id}">대표로</button>`}<button data-up="${i}" ${i===0?"disabled":""}>↑</button><button data-down="${i}" ${i===photos.length-1?"disabled":""}>↓</button><button data-delete="${p.id}" style="color:var(--brick)">삭제</button></div></div>`).join("");gallery.querySelectorAll("button").forEach(b=>b.onclick=async()=>{try{if(b.dataset.primary){await api(`/api/lodging-operator/photos/${b.dataset.primary}/primary`,{method:"PUT"})}else if(b.dataset.delete){if(!confirm("이 사진을 삭제할까요?"))return;await api(`/api/lodging-operator/photos/${b.dataset.delete}`,{method:"DELETE"})}else{const i=Number(b.dataset.up??b.dataset.down),j=b.dataset.up!==undefined?i-1:i+1;[photos[i],photos[j]]=[photos[j],photos[i]];await api("/api/lodging-operator/photos/reorder",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({photo_ids:photos.map(x=>x.id)})})}await loadPhotos()}catch(e){galleryMsg.textContent=e.message;galleryMsg.style.color="var(--brick)"}})}
async function loadPhotos(){const d=await api("/api/lodging-operator/photos");photos=d.items||d.photos||[];renderPhotos()}
fetch('/api/lodging-operator/me').then(r=>r.json()).then(async d=>{if(!d.ok)throw Error(d.message);const x=d.item;['booking_url','airbnb_url','intro_text'].forEach(k=>document.querySelector('#'+k).value=x[k]||'');airbnb_urls.value=(x.airbnb_urls||[]).join('\n');document.querySelector("#profileInfo").textContent=[x.biz_name,x.rep_name,x.phone].filter(Boolean).join(" · ");n.textContent="현재 운영자 프로필을 수정할 수 있습니다.";f.hidden=false;document.querySelector("#gallerySection").hidden=false;await loadPhotos()}).catch(e=>{n.textContent=e.message||"운영자 정보를 불러올 수 없습니다.";applyAction.hidden=false});
f.onsubmit=async e=>{e.preventDefault();try{await api('/api/lodging-operator/me',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking_url:booking_url.value.trim(),airbnb_url:airbnb_url.value.trim(),intro_text:intro_text.value.trim(),airbnb_urls:airbnb_urls.value.split('\n').map(x=>x.trim()).filter(Boolean)})});alert('저장되었습니다.')}catch(e){alert(e.message)}};
photoUpload.onchange=async()=>{const files=[...photoUpload.files];if(photos.length+files.length>10){galleryMsg.textContent="사진은 최대 10장까지 등록할 수 있습니다.";galleryMsg.style.color="var(--brick)";return}for(const file of files){const fd=new FormData();fd.append("file",file);try{galleryMsg.textContent=`${file.name} 업로드 중…`;await api("/api/lodging-operator/photos",{method:"POST",body:fd})}catch(e){galleryMsg.textContent=e.message;galleryMsg.style.color="var(--brick)";break}}photoUpload.value="";await loadPhotos();galleryMsg.textContent="사진이 등록되었습니다.";galleryMsg.style.color="#17834b"};</script><script src="/static/js/header.js"></script></body></html>
