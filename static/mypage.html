<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>숙박시설은 홈앤스테이</title>
<meta name="description" content="홈앤스테이 마이페이지." />
<link rel="icon" href="/static/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/static/js/icons.js"></script>
<style>
  .agent-tabbar{ display:flex; gap:4px; margin:18px 0 14px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .agent-tab{
    padding:10px 16px; font-size:14px; font-weight:600; color:var(--ink-soft);
    background:none; border:none; border-bottom:2px solid transparent;
    cursor:pointer; margin-bottom:-1px; white-space:nowrap; flex-shrink:0;
  }
  .agent-tab:hover{ color:var(--ink); }
  .agent-tab.is-active{ color:var(--brass-dark); border-bottom-color:var(--brass); }
  .agent-tabpanel{ display:none; }
  .agent-tabpanel.is-active{ display:block; }
  .agent-guide{
    background:var(--brass-tint); border-radius:var(--radius);
    padding:12px 16px; margin-bottom:14px; font-size:12.5px;
    color:var(--ink); line-height:1.6;
  }
  .mp-section-box{
    background:#F7F5F0; border-radius:10px; padding:14px 16px; margin-bottom:14px;
  }
  .mp-section-title{
    font-size:12px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px;
  }
</style>
</head>
<body>

<header id="siteHeader"></header>

<div class="search-panel" style="max-width:720px; padding-bottom:56px;">

  <!-- ── 로딩/비로그인 상태 ── -->
  <div id="myLoading" class="panel-card" style="margin-top:16px;">
    <div style="text-align:center; padding:40px 12px; color:var(--ink-soft);">불러오는 중…</div>
  </div>

  <!-- ── 로그인 후 본문 (초기에는 숨김) ── -->
  <div id="myMain" style="display:none;">

    <!-- 헤더 카드 -->
    <div class="panel-card" style="margin-top:16px;">
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div style="width:54px; height:54px; border-radius:50%; background:var(--brass-tint); color:var(--brass-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;" aria-hidden="true"><span id="mypageProfileIcon"></span></div>
        <div style="flex:1; min-width:160px;">
          <div id="profileName" style="font-size:18px; font-weight:700; color:var(--ink);"></div>
          <div id="profileEmail" style="font-size:12.5px; color:var(--ink-soft); margin-top:3px;"></div>
          <div id="profileProvider" style="font-size:11.5px; color:var(--ink-soft); margin-top:1px;"></div>
        </div>
      </div>
      <div id="profileActions" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px;">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <button id="btnGoAccount" class="side-more" style="width:auto; margin-top:0; padding:8px 16px;">정보 수정</button>
          <button id="btnGoPassword" class="side-more" style="width:auto; margin-top:0; padding:8px 16px; display:none;">비밀번호 변경</button>
        </div>
      </div>
    </div>

    <!-- 탭바 -->
    <div class="agent-tabbar">
      <button class="agent-tab is-active" data-tab="favorites">관심단지</button>
      <button class="agent-tab" data-tab="listing">매물내놓기 현황</button>
      <button class="agent-tab" data-tab="buy">매수의뢰 현황</button>
      <button class="agent-tab" data-tab="account">계정</button>
    </div>

    <!-- ── 탭: 관심단지 ── -->
    <div class="agent-tabpanel is-active" data-tabpanel="favorites">
      <div class="panel-card" style="margin-top:14px;">
        <div class="agent-guide">건물 상세페이지에서 <span id="mypageFavoriteIcon" class="inline-icon" aria-hidden="true"></span> 를 눌러 관심단지로 저장할 수 있습니다. 새 실거래가 등록되면 이메일로 알려드립니다.</div>

        <!-- 이메일 알림 토글 -->
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:8px; padding:10px 14px; border:1px solid var(--line); border-radius:8px;">
          <input type="checkbox" id="emailAlertChk" style="accent-color:var(--brass); flex-shrink:0;" />
          <label for="emailAlertChk" style="font-size:13.5px; color:var(--ink); cursor:pointer; flex:1;">실거래 이메일 알림 받기</label>
          <span id="emailAlertMsg" style="font-size:12px; color:var(--ink-soft);"></span>
        </div>
        <!-- 주간 소식 이메일 토글 -->
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:14px; padding:10px 14px; border:1px solid var(--line); border-radius:8px;">
          <input type="checkbox" id="weeklyEmailChk" style="accent-color:var(--brass); flex-shrink:0;" />
          <label for="weeklyEmailChk" style="font-size:13.5px; color:var(--ink); cursor:pointer; flex:1;">주간 소식 이메일 받기 <span style="font-size:11px; color:var(--ink-soft);">(시세 랭킹·관심단지 요약 등)</span></label>
          <span id="weeklyEmailMsg" style="font-size:12px; color:var(--ink-soft);"></span>
        </div>

        <div class="side-card-title" style="margin-bottom:10px;">내 관심단지</div>
        <div id="myFavList"><div style="text-align:center; padding:18px 12px; color:var(--ink-soft); font-size:13px;">불러오는 중…</div></div>
      </div>
    </div>

    <!-- ── 탭: 매물내놓기 현황 ── -->
    <div class="agent-tabpanel" data-tabpanel="listing">
      <div class="panel-card" style="margin-top:14px;">
        <div class="agent-guide">건물 상세화면의 <b>"매물 내놓기"</b> 버튼으로 의뢰하면 여기에 현황이 표시됩니다.</div>
        <div id="myListingReqs"><div style="text-align:center; padding:18px 12px; color:var(--ink-soft); font-size:13px;">불러오는 중…</div></div>
      </div>
    </div>

    <!-- ── 탭: 매수의뢰 현황 ── -->
    <div class="agent-tabpanel" data-tabpanel="buy">
      <div class="panel-card" style="margin-top:14px;">
        <div id="myBuyReqs"><div style="text-align:center; padding:18px 12px; color:var(--ink-soft); font-size:13px;">불러오는 중…</div></div>
        <div style="background:#FFF8EE; border:1px solid #EAD9B8; border-radius:10px; padding:14px 16px; margin-top:14px;">
          <div style="font-size:13px; font-weight:700; color:#8F6A2F; margin-bottom:6px;">모텔 등 건물전체거래전용</div>
          <div style="font-size:12px; color:var(--ink-soft); line-height:1.6; margin-bottom:10px;">
            매수의뢰 전 영업신고 확인·인허가 이력·세금 체납 조회 등
            14개 항목을 공인기관에서 직접 확인하시기 바랍니다.
          </div>
          <button id="buyChecklist" class="side-more" style="width:auto; padding:6px 14px; font-size:12px;">숙박업소 거래 체크리스트 열어보기</button>
        </div>
      </div>
    </div>

    <!-- ── 탭: 계정 ── -->
    <div class="agent-tabpanel" data-tabpanel="account">
      <div class="panel-card" style="margin-top:14px;">

        <!-- 이름 변경 -->
        <div class="mp-section-box">
          <div class="mp-section-title">이름 변경</div>
          <label style="display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;">이름</label>
          <input id="nameInput" type="text" maxlength="50"
            style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; box-sizing:border-box;" />
          <div id="nameMsg" style="font-size:12.5px; margin-top:6px; min-height:16px;"></div>
          <button id="nameSaveBtn" class="btn-search" style="width:100%; padding:11px; margin-top:8px;">이름 저장</button>
        </div>

        <!-- 비밀번호 변경 (이메일 계정만) / 카카오 안내 -->
        <div id="pwSection" class="mp-section-box"></div>

        <!-- 로그아웃 -->
        <button id="logoutBtn" class="side-more"
          style="width:100%; margin-top:0; margin-bottom:10px; padding:12px; background:#fff; color:var(--ink); border:1px solid var(--line);">로그아웃</button>

        <!-- 회원탈퇴 -->
        <div style="padding-top:6px;">
          <button id="withdrawBtn"
            style="width:100%; padding:11px; background:transparent; color:var(--brick); border:1px solid #F0CFCB; border-radius:8px; font-size:13.5px; font-family:inherit; cursor:pointer;">회원탈퇴</button>
        </div>

      </div>
    </div>

  </div><!-- /#myMain -->
</div>

<script src="/static/js/chat_common.js"></script>
<script>
  // ── 유틸 ──────────────────────────────────────────────────────────────────
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function iconLabel(icon, size, label){
    return '<span style="display:inline-flex;align-items:center;gap:4px;">' + icon(size) + '<span>' + label + '</span></span>';
  }
  function alertLabel(enabled){
    return iconLabel(Icons.bell, 13, enabled ? "알림 중" : "알림 켜기");
  }
  function showMsg(id, text, ok){
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || "";
    el.style.color = ok ? "var(--brass-dark)" : "var(--brick)";
  }

  var PROVIDER_KR = { email: "이메일", kakao: "카카오" };
  var CURRENT = null;

  // ── 탭 전환 ───────────────────────────────────────────────────────────────
  function switchTab(name){
    document.querySelectorAll(".agent-tab").forEach(function(t){
      t.classList.toggle("is-active", t.getAttribute("data-tab") === name);
    });
    document.querySelectorAll(".agent-tabpanel").forEach(function(p){
      p.classList.toggle("is-active", p.getAttribute("data-tabpanel") === name);
    });
    if (name === "buy") loadMyBuyRequests();
  }
  document.querySelectorAll(".agent-tab").forEach(function(t){
    t.addEventListener("click", function(){ switchTab(t.getAttribute("data-tab")); });
  });

  // ── 렌더링 (로그인 성공) ─────────────────────────────────────────────────
  function renderLoggedIn(d){
    CURRENT = d;
    var isEmail = (d.provider === "email");

    // 헤더 카드 채우기
    document.getElementById("profileName").textContent = d.name || "회원";
    document.getElementById("profileEmail").textContent = d.email || "";
    document.getElementById("profileProvider").textContent = (PROVIDER_KR[d.provider] || d.provider || "") + " 로그인";

    // 비밀번호 변경 버튼 — 이메일 계정만 표시
    if (isEmail) document.getElementById("btnGoPassword").style.display = "";

    // 이메일 알림 토글 초기값
    var emailAlertOn = (d.email_alert_enabled !== false);
    document.getElementById("emailAlertChk").checked = emailAlertOn;
    document.getElementById("emailAlertChk").addEventListener("change", doToggleEmailAlert);

    // 주간 소식 이메일 토글 초기값
    var weeklyOn = (d.weekly_email_enabled === true);
    document.getElementById("weeklyEmailChk").checked = weeklyOn;
    document.getElementById("weeklyEmailChk").addEventListener("change", doToggleWeeklyEmail);

    // 이름 입력 초기값
    document.getElementById("nameInput").value = d.name || "";

    // 비밀번호 영역 (계정 탭)
    var pwBox = document.getElementById("pwSection");
    if (isEmail){
      pwBox.innerHTML =
        '<div class="mp-section-title">비밀번호 변경</div>' +
        '<label style="display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;">현재 비밀번호</label>' +
        '<input id="curPw" type="password" autocomplete="current-password" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; box-sizing:border-box; margin-bottom:10px;" />' +
        '<label style="display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;">새 비밀번호 (8자 이상)</label>' +
        '<input id="newPw" type="password" autocomplete="new-password" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; box-sizing:border-box;" />' +
        '<div id="pwMsg" style="font-size:12.5px; margin-top:6px; min-height:16px;"></div>' +
        '<button id="pwSaveBtn" class="btn-search" style="width:100%; padding:11px; margin-top:8px;">비밀번호 변경</button>';
      document.getElementById("pwSaveBtn").addEventListener("click", doChangePassword);
    } else {
      pwBox.innerHTML =
        '<div class="mp-section-title">비밀번호</div>' +
        '<div style="font-size:13px; color:var(--ink-soft); background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; line-height:1.6;">' +
          '카카오 계정으로 로그인 중입니다.<br>비밀번호 변경이 필요하지 않습니다.' +
        '</div>';
    }

    // 버튼 이벤트
    document.getElementById("btnGoAccount").addEventListener("click", function(){ switchTab("account"); });
    if (isEmail){
      document.getElementById("btnGoPassword").addEventListener("click", function(){
        switchTab("account");
        setTimeout(function(){ var el = document.getElementById("curPw"); if (el) el.focus(); }, 80);
      });
    }
    document.getElementById("nameSaveBtn").addEventListener("click", doSaveName);
    document.getElementById("logoutBtn").addEventListener("click", doLogout);
    document.getElementById("withdrawBtn").addEventListener("click", openWithdrawModal);
    document.getElementById("buyChecklist").addEventListener("click", function(){
      window.LivingstayListingChecklist?.open();
    });

    // 데이터 로드
    loadMyFavorites();
    loadMyListingRequests();

    // 화면 전환
    document.getElementById("myLoading").style.display = "none";
    document.getElementById("myMain").style.display = "";
  }

  // ── 매물의뢰 현황 ─────────────────────────────────────────────────────────
  var LR_STATUS_LABEL = { submitted: "접수됨", "보류": "보류중", in_progress: "처리중", done: "완료", "철회됨": "철회됨" };
  var LR_STATUS_COLOR = { submitted: "#4A7A18", "보류": "#B45309", in_progress: "#B4863F", done: "#6B7684", "철회됨": "#999" };
  var MY_LISTING_BY_ID = {};

  function requestItemHtml(it){
    var st = LR_STATUS_LABEL[it.status] || it.status;
    var color = LR_STATUS_COLOR[it.status] || "var(--ink-soft)";
    // ── 직거래/중개거래 뱃지 ──
    var modeBadge = it.deal_mode === "direct"
      ? '<span style="font-size:10.5px;font-weight:700;color:#4A7A18;border:1px solid #4A7A18;border-radius:999px;padding:2px 7px;margin-left:5px;vertical-align:middle;">직거래</span>'
      : '<span style="font-size:10.5px;font-weight:700;color:#B4863F;border:1px solid #B4863F;border-radius:999px;padding:2px 7px;margin-left:5px;vertical-align:middle;">중개거래</span>';
    // ── 담당자 표시 (직거래는 중개사 배정 없음) ──
    var agentHtml;
    if (it.deal_mode === "direct") {
      agentHtml = '<span style="color:var(--ink-soft);">직거래 진행 중</span>';
    } else if (it.agent_office_name) {
      var officeName = escapeHtml(it.agent_office_name);
      agentHtml = it.agent_slug
        ? '담당 <a href="/agent/' + encodeURIComponent(it.agent_slug) + '" style="color:var(--brass); font-weight:700; text-decoration:none; border-bottom:1px dashed var(--brass);">' + officeName + '</a>'
        : '담당 <span style="font-weight:700;">' + officeName + '</span>';
    } else {
      agentHtml = '<span style="color:var(--ink-soft);">담당자 배정 중</span>';
    }
    // ── 채팅 문의 버튼 (매도자 입장 — 내 매물에 온 문의) ──
    var chatCount = parseInt(it.chat_room_count, 10) || 0;
    var chatBtn = chatCount > 0
      ? '<button class="lr-chat-btn" data-id="' + it.id + '" data-count="' + chatCount + '" style="font-size:11px;padding:3px 9px;border:1px solid var(--brass);border-radius:5px;background:none;color:var(--brass);cursor:pointer;margin-top:4px;">' + iconLabel(Icons.messageCircle, 13, '채팅 ' + chatCount + '건') + '</button>'
      : '';
    var actionBtns = "";
    if (it.status === "submitted" || it.status === "보류") {
      var isHeld = it.status === "보류";
      var holdButton = isHeld
        ? '<button class="lr-resume-btn" data-id="' + it.id + '" style="font-size:11px;padding:3px 9px;border:1px solid #B45309;border-radius:5px;background:none;color:#B45309;cursor:pointer;">보류해제</button>'
        : '<button class="lr-hold-btn" data-id="' + it.id + '" style="font-size:11px;padding:3px 9px;border:1px solid #B45309;border-radius:5px;background:none;color:#B45309;cursor:pointer;">보류</button>';
      var scopeButton = "";
      var scope = it.disclosure_scope === "public" ? "public" : "limited";
      var scopeLabel = scope === "public" ? "전체공개" : "제한공개";
      if (it.transaction_target === "whole") {
        scopeButton = '<button class="lr-disclosure-btn" data-id="' + it.id + '" data-scope="' + scope + '" style="font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:none;color:var(--ink-soft);cursor:pointer;">' + scopeLabel + '</button>';
      }
      actionBtns = '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">' +
        '<button class="lr-edit-btn" data-id="' + it.id + '" data-bid="' + it.building_id + '" data-bname="' + escapeHtml(it.building_name||"") + '" data-deal="' + escapeHtml(it.deal_type) + '" data-price="' + (it.price_krw||"") + '" data-rent="' + (it.monthly_rent_krw||"") + '" data-phone="' + escapeHtml(it.contact_phone||"") + '" style="font-size:11px;padding:3px 9px;border:1px solid var(--brass);border-radius:5px;background:none;color:var(--brass);cursor:pointer;">수정</button>' +
        holdButton +
        '<button class="lr-withdraw-btn" data-id="' + it.id + '" style="font-size:11px;padding:3px 9px;border:1px solid #999;border-radius:5px;background:none;color:#999;cursor:pointer;">철회</button>' +
        scopeButton +
      '</div>';
    }
    return '<div style="padding:11px 4px; border-bottom:1px solid var(--line);">' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">' +
        '<div style="min-width:0; flex:1;">' +
          '<a href="/building/' + it.building_id + '" style="font-size:13.5px; font-weight:700; color:var(--ink); text-decoration:none;">' + escapeHtml(it.building_name || "(건물명 미확인)") + '</a>' +
          modeBadge +
          '<div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">' + (it.transaction_target === "whole" ? '<b style="color:var(--brass);">건물전체</b> · ' : '') + escapeHtml(it.deal_type) +
            (it.price_krw != null ? ' · ' + escapeHtml(it.transaction_target === "whole"
              ? (it.deal_type === "매매" ? "매매가 " + fmtPrice(it.price_krw) + "만원" : "보증금 " + fmtPrice(it.price_krw) + "만원" + (it.monthly_rent_krw != null ? " / 월 " + fmtPrice(it.monthly_rent_krw) + "만원" : ""))
              : fmtLrPrice(it.deal_type, it.price_krw, it.monthly_rent_krw, it.price_krw_max)) : '') +
            (it.transaction_target !== "whole" && it.room_count != null ? ' · 총 ' + Number(it.room_count).toLocaleString() + '실' : '') +
            ' · 최근 수정 ' + it.created_date + '</div>' +
          '<div style="font-size:12px; margin-top:3px;">' + agentHtml + '</div>' +
          (chatBtn ? '<div>' + chatBtn + '</div>' : '') +
          actionBtns +
        '</div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">' +

    function roomDdayMeta(dateText){
     if (!/^\d{4}-\d{2}-\d{2}$/.test(dateText || "")) return null;
     var parts = dateText.split("-").map(Number);
     var expiryUtc = Date.UTC(parts[0], parts[1] - 1, parts[2]);
     var now = new Date();
     var todayUtc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
     var days = Math.round((expiryUtc - todayUtc) / 86400000);
     if (days > 30) return { label: "만기 " + dateText, color: "#6B7684", bg: "#f2f4f6" };
     var dday = days >= 0 ? "D-" + days : "D+" + Math.abs(days);
     if (days > 7) return { label: dday, color: "#B45309", bg: "#fff3df" };
     return { label: dday, color: "#B42318", bg: "#fff0ee" };
   }

        '<div class="room-inventory-summary" style="margin-top:6px;font-size:11.5px;color:var(--ink-soft);">전체 ' + total + '실 · 장박가능 ' + longStayRooms.length + '실(공실 ' + longStayVacant + ') · OTA전용 ' + otaRooms + '실</div>' +

    function loadRoomInventory(lrId, box, focusRoomId){
     var target = box.querySelector('.lr-room-inventory[data-lr-id="' + lrId + '"]');
     if (!target) return;
     fetch("/api/my/listing-requests/" + lrId + "/rooms", { credentials: "same-origin" })
       .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
       .then(function(res){
         if (!res.ok || !res.j || !res.j.ok) {
           target.innerHTML = '<div style="font-size:11.5px;color:var(--brick);">방 재고를 불러오지 못했습니다.</div>';
           return;
         }
         target.innerHTML = roomInventoryHtml(res.j.items || []);
         bindRoomInventoryEvents(target, lrId, box);
          if (focusRoomId) {
            var input = target.querySelector('.room-inventory-card[data-room-id="' + focusRoomId + '"] .room-label');
            if (input) { input.focus(); input.select(); }
          }
       })
       .catch(function(){
         target.innerHTML = '<div style="font-size:11.5px;color:var(--brick);">방 재고를 불러오지 못했습니다.</div>';
       });
   }

   function saveRoomInventory(card, lrId, box){
     var roomId = card.getAttribute("data-room-id");
     var statusEl = card.querySelector(".room-status");
     var dateEl = card.querySelector(".room-contract-date");
      var roomLabelEl = card.querySelector(".room-label");
       var depositEl = card.querySelector(".room-deposit");
      var rentEl = card.querySelector(".room-monthly-rent");
      var channelEl = card.querySelector(".room-channel");
     var msg = card.querySelector(".room-inventory-msg");
     var status = statusEl.value;
     var contractEndDate = dateEl ? dateEl.value : "";
      var roomLabel = roomLabelEl ? roomLabelEl.value.trim() : "";
       var depositText = depositEl ? depositEl.value.trim() : "";
       var deposit = depositText ? Number(depositText) : null;
      var rentText = rentEl ? rentEl.value.trim() : "";
      var monthlyRent = rentText ? Number(rentText) : null;
      if (!roomLabel) {
        if (msg) { msg.style.color = "var(--brick)"; msg.textContent = "호실 표기를 입력해주세요."; }
        return;
      }
      if (rentText && (!Number.isInteger(monthlyRent) || monthlyRent < 1)) {
        if (msg) { msg.style.color = "var(--brick)"; msg.textContent = "월세는 1만원 이상의 숫자로 입력해주세요."; }
        return;
      }
       if (depositText && (!Number.isInteger(deposit) || deposit < 1)) {
         if (msg) { msg.style.color = "var(--brick)"; msg.textContent = "보증금은 1만원 이상의 숫자로 입력해주세요."; }
         return;
       }
     statusEl.disabled = true;
     if (dateEl) dateEl.disabled = true;
      if (roomLabelEl) roomLabelEl.disabled = true;
       if (depositEl) depositEl.disabled = true;
      if (rentEl) rentEl.disabled = true;
      if (channelEl) channelEl.disabled = true;
     if (msg) { msg.style.color = "var(--ink-soft)"; msg.textContent = "저장 중…"; }
     fetch("/api/my/room-inventory/" + roomId, {
       method: "PUT", credentials: "same-origin",
       headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
           room_label: roomLabel,
          status: status,
          contract_end_date: contractEndDate,
            deposit_krw: deposit,
           monthly_rent_krw: monthlyRent,
          channel: channelEl ? channelEl.value : "장박가능"
        })
     }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
       .then(function(res){
         if (!res.ok || !res.j || !res.j.ok) {
           statusEl.disabled = false;
           if (dateEl) dateEl.disabled = false;
            if (roomLabelEl) roomLabelEl.disabled = false;
             if (depositEl) depositEl.disabled = false;
            if (rentEl) rentEl.disabled = false;
            if (channelEl) channelEl.disabled = false;
           if (msg) { msg.style.color = "var(--brick)"; msg.textContent = (res.j && res.j.message) || "저장하지 못했습니다."; }
           return;
         }
         loadRoomInventory(lrId, box);
       })
       .catch(function(){
         statusEl.disabled = false;
         if (dateEl) dateEl.disabled = false;
          if (roomLabelEl) roomLabelEl.disabled = false;
           if (depositEl) depositEl.disabled = false;
          if (rentEl) rentEl.disabled = false;
          if (channelEl) channelEl.disabled = false;
         if (msg) { msg.style.color = "var(--brick)"; msg.textContent = "네트워크 오류로 저장하지 못했습니다."; }
       });
   }

              room_label: label,
               deposit_krw: depositText ? Number(depositText) : null,
              monthly_rent_krw: rentText ? Number(rentText) : null,
              status: status,
              channel: channel,
              contract_end_date: contractDate ? contractDate.value : ""
            })
          }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
            .then(function(res){
              if (!res.ok || !res.j || !res.j.ok) { copyBtn.disabled = false; alert((res.j && res.j.message) || "방을 복사하지 못했습니다."); return; }
              loadRoomInventory(lrId, box, res.j.item && res.j.item.id);
            })
            .catch(function(){ copyBtn.disabled = false; alert("네트워크 오류로 방을 복사하지 못했습니다."); });
        });
      });
      Array.prototype.forEach.call(target.querySelectorAll(".room-label, .room-deposit, .room-monthly-rent, .room-status, .room-contract-date, .room-channel"), function(el){
       el.addEventListener("change", function(){

  function bindListingRequestEvents(box) {
    // 이력 보기 토글
    Array.prototype.forEach.call(box.querySelectorAll(".lr-history-btn"), function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        var hbox = box.querySelector('.lr-history-box[data-id="' + id + '"]');
        if (!hbox) return;
        if (hbox.style.display !== "none") { hbox.style.display = "none"; btn.textContent = "이력 보기 ▾"; return; }
        btn.textContent = "불러오는 중…";
        fetch("/api/listing-requests/" + id + "/history", { credentials: "same-origin" })
          .then(function(r){ return r.json(); })
          .then(function(d){
            btn.textContent = "이력 닫기 ▴";
            if (!d.ok || !d.history.length) { hbox.innerHTML = "이력 없음"; hbox.style.display = "block"; return; }
            var ACTION_LABEL = {
              created: "접수", edited: "수정", withdrawn: "철회",
              held: "보류", resumed: "보류해제", scope_changed: "공개범위 변경"
            };
            hbox.innerHTML = d.history.map(function(h){
              var label = ACTION_LABEL[h.action] || h.action;
              var detail = "";
              if (h.action === "created" && h.after_data) {
                var a = h.after_data;
                detail = (a.deal_type||"") + (a.price_krw ? " · " + fmtPrice(a.price_krw) + "만원" : "") + (a.monthly_rent_krw ? "/월" + fmtPrice(a.monthly_rent_krw) + "만원" : "");
              } else if (h.action === "edited" && h.before_data && h.after_data) {
                var b = h.before_data, af = h.after_data;
                detail = (b.deal_type||"") + (b.price_krw ? " " + fmtPrice(b.price_krw) + "만원" : "") + " → " + (af.deal_type||"") + (af.price_krw ? " " + fmtPrice(af.price_krw) + "만원" : "");
              }
              return '<div style="padding:2px 0;">' + h.created_at + ' · ' + label + (detail ? ' · ' + detail : '') + '</div>';
            }).join("");
            hbox.style.display = "block";
          })
          .catch(function(){ btn.textContent = "이력 보기 ▾"; });
      });
    });

      });
    });
    // 철회 버튼
    Array.prototype.forEach.call(box.querySelectorAll(".lr-withdraw-btn"), function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        if (!confirm("정말 철회하시겠어요? 철회하면 해당 의뢰와 채팅 이력이 완전히 삭제됩니다.")) return;
        btn.disabled = true;
        fetch("/api/listing-requests/" + id + "/withdraw", {
          method: "POST", credentials: "same-origin"
        }).then(function(r){ return r.json(); })
          .then(function(j){ if (j && j.ok) loadMyListingRequests(); else { btn.disabled = false; alert(j.message || "철회에 실패했습니다."); } })
          .catch(function(){ btn.disabled = false; });
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll(".lr-disclosure-btn"), function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        var currentScope = btn.getAttribute("data-scope") === "public" ? "public" : "limited";
        var nextScope = currentScope === "public" ? "limited" : "public";
        var nextLabel = nextScope === "public" ? "전체공개" : "제한공개";
        btn.disabled = true;
        fetch("/api/listing-requests/" + id + "/disclosure-scope", {
          method: "PATCH", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ disclosure_scope: nextScope })
        }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
          .then(function(res) {
            if (!res.ok || !res.j || !res.j.ok) {
              btn.disabled = false;
              alert((res.j && res.j.message) || "공개범위를 변경하지 못했습니다.");
              return;
            }
            btn.setAttribute("data-scope", nextScope);
            btn.textContent = nextLabel;
            btn.disabled = false;
            if (MY_LISTING_BY_ID[id]) MY_LISTING_BY_ID[id].disclosure_scope = nextScope;
          })
          .catch(function(){ btn.disabled = false; alert("네트워크 오류가 발생했습니다."); });
      });
    });
    // 채팅 문의 버튼 — 내 직거래 매물에 온 문의 목록 / 바로 열기
    Array.prototype.forEach.call(box.querySelectorAll(".lr-chat-btn"), function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        var count = parseInt(btn.getAttribute("data-count"), 10) || 0;
        fetch("/api/my/listing-requests/" + id + "/chat-rooms", { credentials: "same-origin" })
          .then(function(r){ return r.json(); })
          .then(function(d){
            if (!d.ok || !d.rooms || !d.rooms.length) { alert("채팅방을 불러오지 못했습니다."); return; }
            if (d.rooms.length === 1) {
              openMypageChatModal(d.rooms[0].room_id);
            } else {
              openChatRoomListModal(d.rooms);
            }
          })
          .catch(function(){ alert("오류가 발생했습니다."); });
      });
    });
  }

  function loadMyListingRequests(){
    var box = document.getElementById("myListingReqs");
    if (!box) return;
    fetch("/api/listing-requests/mine", { credentials: "same-origin" })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var items = (d && d.items) || [];
        MY_LISTING_BY_ID = {};
        items.forEach(function(item){ MY_LISTING_BY_ID[String(item.id)] = item; });
        if (!items.length){
          box.innerHTML = '<div style="text-align:center; padding:18px 12px; color:var(--ink-soft); font-size:13px; background:var(--brass-tint); border-radius:8px;">접수한 매물의뢰가 없습니다.</div>';
          return;
        }
        box.innerHTML = items.map(requestItemHtml).join("");
        bindListingRequestEvents(box);
         items.forEach(function(item){ loadRoomInventory(item.id, box); });
      })
      .catch(function(){
        box.innerHTML = '<div style="text-align:center; padding:14px; color:var(--ink-soft); font-size:13px;">매물의뢰 현황을 불러오지 못했습니다.</div>';
      });
  }

  // ── 내 관심단지 ───────────────────────────────────────────────────────────
  function favEmptyHtml(msg){
    var extra = (msg === "저장된 관심단지가 없습니다.")
      ? '<div style="margin-top:10px; font-size:12px; font-weight:400; color:var(--ink-soft);">관심단지를 저장하고 실거래알림까지 받아보세요 — 새 거래 발생 시 이메일로 바로 알려드려요</div>' +
        '<div style="margin-top:12px;"><a href="/" style="display:inline-block;background:var(--brass,#B4863F);color:#fff;text-decoration:none;padding:8px 18px;border-radius:7px;font-size:13px;font-weight:700;">🗺️ 지도에서 관심단지 찾기 →</a></div>'
      : '';
    return '<div style="text-align:center; padding:22px 12px; color:var(--ink-soft); font-size:13px; border:1px dashed var(--line); border-radius:8px;">' + escapeHtml(msg) + extra + '</div>';
  }
  function fmtPrice(p){
    if (p == null) return "실거래 정보 없음";
    return Number(p).toLocaleString();
  }
  function fmtLrPrice(deal_type, price_krw, monthly_rent_krw, price_krw_max){
    var fN = function(v){ return v != null ? Number(v).toLocaleString() : "-"; };
    if (deal_type === "월세") return price_krw_max != null ? fN(price_krw) + " ~ " + fN(price_krw_max) : "보" + fN(price_krw) + "/" + fN(monthly_rent_krw);
    if (deal_type === "단기임대") return price_krw != null ? fN(price_krw) + (price_krw_max != null ? " ~ " + fN(price_krw_max) : "") : "-";
    return price_krw_max != null ? fN(price_krw) + " ~ " + fN(price_krw_max) : fN(price_krw);
  }

  // ── 채팅 모달 (마이페이지 전용 — main.js 미포함) ─────────────────────────
  var _mpChatPollTimer = null;
  var _mpChatLastCount = 0;
  var _mpChatActiveRoomToken = null;
  function openMypageChatModal(roomId) {
    // 기존 모달 제거
    var old = document.getElementById("mpChatOverlay");
    if (old) old.remove();
    if (_mpChatPollTimer) { clearInterval(_mpChatPollTimer); _mpChatPollTimer = null; }
    _mpChatLastCount = 0;
    var roomToken = {};
    var messageLoadSequence = 0;
    _mpChatActiveRoomToken = roomToken;
    var _mpChatRole = null;
    var _mpChatPendingAttachment = null;
    var _mpChatTplStorageKey = "chatUsedTpl_" + roomId;
    var _mpChatUsedTemplates = new Set();
    try {
      var storedTemplates = JSON.parse(localStorage.getItem(_mpChatTplStorageKey) || "[]");
      if (Array.isArray(storedTemplates)) _mpChatUsedTemplates = new Set(storedTemplates);
    } catch (e) {}

    var overlay = document.createElement("div");
    overlay.id = "mpChatOverlay";
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:4000;display:flex;align-items:flex-end;justify-content:center;";
    overlay.innerHTML =
      '<div id="mpChatBox" style="background:#fff;width:100%;max-width:520px;height:72vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 -4px 24px rgba(0,0,0,.18);">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #eee;background:#fff;">' +
          '<span style="font-size:15px;font-weight:700;color:#B4863F;display:inline-flex;align-items:center;gap:5px;">' + Icons.messageCircle(17) + '<span id="mpChatOpponentName">상대방</span></span>' +
          '<button id="mpChatClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#999;line-height:1;">×</button>' +
        '</div>' +
        '<div id="mpChatMsgs" style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;"></div>' +
        '<div id="mpChatSafetyNotice" role="status" style="display:none;margin:0 14px 8px;padding:9px 10px;border-radius:8px;background:#FFF7E6;border:1px solid #FFD898;color:#7D4A00;font-size:11.5px;line-height:1.55;"></div>' +
        '<div id="mpChatGreeting" style="display:none;padding:0 14px 8px;"></div>' +
      '<div id="mpChatAttachPreview" style="display:none;padding:6px 14px;background:#fafafa;border-top:1px solid #eee;font-size:12px;color:#888;align-items:center;gap:6px;"></div>' +
      '<div style="padding:10px 12px;border-top:1px solid #eee;display:flex;gap:8px;align-items:center;">' +
        '<input type="file" id="mpChatFileInput" accept=".jpg,.jpeg,.png,.pdf" style="display:none;" />' +
        '<button type="button" id="mpChatAttachBtn" title="파일 첨부 (JPG, PNG, PDF)" aria-label="파일 첨부" style="background:none;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:17px;cursor:pointer;color:#888;line-height:1;">📎</button>' +
        '<input id="mpChatInput" type="text" placeholder="메시지 입력…" style="flex:1;border:1px solid #ddd;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;" />' +
          '<button id="mpChatSend" style="background:#B4863F;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;white-space:nowrap;">전송</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    function renderMsgs(msgs, myUserId) {
      var box = document.getElementById("mpChatMsgs");
      if (!box) return;
      var meId = (myUserId != null) ? myUserId : (window._livingstayUserId || 0);
      _mpChatLastCount = msgs.length;
      box.innerHTML = msgs.map(function(m) {
        var isMe = (m.sender_user_id == meId);
        var bg = isMe ? "#B4863F" : "#f3f3f3";
        var color = isMe ? "#fff" : "#333";
        var bodyHtml = m.body
          ? '<div style="background:' + bg + ';color:' + color + ';border-radius:14px;padding:8px 12px;max-width:75%;font-size:13.5px;line-height:1.5;word-break:break-word;">' + escapeHtml(m.body) + '</div>'
          : "";
        if (m.attachment_key) {
          var ext = m.attachment_key.split(".").pop().toLowerCase();
          var attachmentUrl = "/api/chat/attachments/" + m.attachment_key;
          if (["jpg", "jpeg", "png"].indexOf(ext) !== -1) {
            bodyHtml += '<a href="' + attachmentUrl + '" target="_blank" rel="noopener" style="display:block;max-width:75%;"><img src="' + attachmentUrl + '" alt="' + escapeHtml(m.attachment_name || "첨부 이미지") + '" style="max-width:100%;max-height:200px;border-radius:8px;display:block;margin-top:' + (m.body ? "4px" : "0") + ';" /></a>';
          } else {
            bodyHtml += '<a href="' + attachmentUrl + '" target="_blank" rel="noopener" style="background:' + bg + ';color:' + color + ';border-radius:14px;padding:8px 12px;max-width:75%;font-size:13px;display:inline-block;text-decoration:none;margin-top:' + (m.body ? "4px" : "0") + ';">📎 ' + escapeHtml(m.attachment_name || "첨부파일") + '</a>';
          }
        }
        return '<div style="display:flex;flex-direction:column;align-items:' + (isMe ? "flex-end" : "flex-start") + ';gap:2px;">' +
          (!isMe ? '<span style="font-size:11px;color:#888;">' + escapeHtml(m.sender_name || "") + '</span>' : "") +
          bodyHtml +
          '<span style="font-size:10px;color:#888;">' + escapeHtml(m.created_at_fmt || m.sent_at || "") + '</span>' +
        '</div>';
      }).join("");
      box.scrollTop = box.scrollHeight;
    }

    function refreshChatTemplates() {
      var greeting = document.getElementById("mpChatGreeting");
      if (!greeting || (_mpChatRole !== "buyer" && _mpChatRole !== "seller")) {
        if (greeting) {
          greeting.innerHTML = "";
          greeting.style.display = "none";
        }
        return;
      }
      var roleClass = _mpChatRole === "seller" ? "seller" : "buyer";
      greeting.innerHTML = window.LivingstayChat.getRoleQuickReplies(_mpChatRole).map(function (tpl) {
        return '<button type="button" class="chat-template-chip ' + roleClass + '" data-tpl="' +
          escapeHtml(tpl) + '">' + escapeHtml(tpl) + '</button>';
      }).join("");
      greeting.querySelectorAll(".chat-template-chip").forEach(function (button) {
        var tpl = button.getAttribute("data-tpl");
        button.style.display = _mpChatUsedTemplates.has(tpl) ? "none" : "inline-flex";
      });
      greeting.style.display = greeting.querySelector(".chat-template-chip:not([style*='display: none'])")
        ? "block" : "none";
    }

    function loadMsgs() {
      var loadSequence = ++messageLoadSequence;
      fetch("/api/chat/rooms/" + roomId + "/messages", { credentials: "same-origin" })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (!d.ok || !window.LivingstayChat.isLatestMessageLoad(
            _mpChatActiveRoomToken,
            roomToken,
            loadSequence,
            messageLoadSequence,
            document.body.contains(overlay)
          )) return;
          if (d.my_role && d.my_role !== _mpChatRole) {
            _mpChatRole = d.my_role;
            refreshChatTemplates();
          }
          var opponentEl = document.getElementById("mpChatOpponentName");
          if (opponentEl) opponentEl.textContent = d.opponent_name || "상대방";
          renderMsgs(d.messages||[], d.my_user_id);
        })
        .catch(function(){});
    }
    loadMsgs();
    _mpChatPollTimer = setInterval(loadMsgs, 5000);

    function uploadAttachment(file) {
      var formData = new FormData();
      formData.append("file", file);
      return fetch("/api/chat/rooms/" + roomId + "/attachments", {
        method: "POST",
        credentials: "same-origin",
        body: formData
      }).then(function(response) {
        return response.json().catch(function(){ return {}; }).then(function(data) {
          if (!response.ok || !data.ok) throw new Error(data.message || "파일 업로드에 실패했습니다.");
          return { key: data.key, name: data.name };
        });
      });
    }

    function sendMsg() {
      var inp = document.getElementById("mpChatInput");
      if (!inp) return;
      var body = (inp.value || "").trim();
      var attachment = _mpChatPendingAttachment;
      if (!body && !attachment) return;
      inp.value = "";
      _mpChatPendingAttachment = null;
      var attachPreview = document.getElementById("mpChatAttachPreview");
      if (attachPreview) {
        attachPreview.style.display = "none";
        attachPreview.innerHTML = "";
      }
      var sendButton = document.getElementById("mpChatSend");
      if (sendButton) sendButton.disabled = true;
      var payload = { body: body };
      if (attachment) {
        payload.attachment_key = attachment.key;
        payload.attachment_name = attachment.name;
      }
      fetch("/api/chat/rooms/" + roomId + "/messages", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function(r){ return r.json(); })
        .then(function(d){
          if (d.ok) {
            var matchedChip = Array.from(document.querySelectorAll("#mpChatGreeting .chat-template-chip"))
              .find(function (button) {
                return button.getAttribute("data-tpl") === body;
              });
            if (matchedChip) {
              _mpChatUsedTemplates.add(body);
              localStorage.setItem(_mpChatTplStorageKey, JSON.stringify(Array.from(_mpChatUsedTemplates)));
              refreshChatTemplates();
            }
            window.LivingstayChat.showSafetyNoticeForMessage(
              body,
              document.getElementById("mpChatSafetyNotice")
            );
            loadMsgs();
          } else {
            inp.value = body;
            _mpChatPendingAttachment = attachment;
            if (attachment && attachPreview) {
              attachPreview.style.display = "flex";
              attachPreview.innerHTML = "📎 " + escapeHtml(attachment.name);
            }
            alert(d.message || "전송에 실패했습니다.");
          }
        })
        .catch(function(){
          inp.value = body;
          _mpChatPendingAttachment = attachment;
          if (attachment && attachPreview) {
            attachPreview.style.display = "flex";
            attachPreview.innerHTML = "📎 " + escapeHtml(attachment.name);
          }
          alert("네트워크 오류가 발생했습니다.");
        })
        .finally(function(){
          if (sendButton) sendButton.disabled = false;
          inp.focus();
        });
    }

    function closeModal() {
      if (_mpChatPollTimer) { clearInterval(_mpChatPollTimer); _mpChatPollTimer = null; }
      if (_mpChatActiveRoomToken === roomToken) _mpChatActiveRoomToken = null;
      overlay.remove();
    }
    document.getElementById("mpChatClose").addEventListener("click", closeModal);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) closeModal(); });
    document.getElementById("mpChatSend").addEventListener("click", sendMsg);
    document.getElementById("mpChatInput").addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
    document.getElementById("mpChatAttachBtn").addEventListener("click", function(){
      document.getElementById("mpChatFileInput").click();
    });
    document.getElementById("mpChatFileInput").addEventListener("change", function(){
      var fileInput = document.getElementById("mpChatFileInput");
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      fileInput.value = "";
      var preview = document.getElementById("mpChatAttachPreview");
      preview.style.display = "flex";
      preview.innerHTML = "📎 " + escapeHtml(file.name) + " 업로드 중…";
      uploadAttachment(file).then(function(attachment){
        _mpChatPendingAttachment = attachment;
        preview.innerHTML = '<span>📎 ' + escapeHtml(attachment.name) + '</span><button type="button" id="mpChatAttachRemove" aria-label="첨부 취소" style="margin-left:6px;background:none;border:none;cursor:pointer;color:#c00;font-size:14px;padding:0;">✕</button>';
        document.getElementById("mpChatAttachRemove").addEventListener("click", function(){
          _mpChatPendingAttachment = null;
          preview.style.display = "none";
          preview.innerHTML = "";
        });
      }).catch(function(error){
        _mpChatPendingAttachment = null;
        preview.style.display = "none";
        preview.innerHTML = "";
        alert(error.message || "파일 업로드에 실패했습니다.");
      });
    });
    document.getElementById("mpChatGreeting").addEventListener("click", function(e){
      var button = e.target.closest(".chat-template-chip");
      var input = document.getElementById("mpChatInput");
      if (button && input) window.LivingstayChat.fillQuickReply(input, button.getAttribute("data-tpl"));
    });
  }
  // 헤더 채팅목록(header.js openChatListModal)이 이 페이지에서도 방을 바로 열 수 있게 공유
  window.openChatModal = openMypageChatModal;
  // 다른 페이지에서 /mypage?openChat=<roomId> 로 넘어온 경우 해당 방 자동 오픈
  (function () {
    var m = /[?&]openChat=(\d+)/.exec(location.search);
    if (m) setTimeout(function(){ openMypageChatModal(parseInt(m[1], 10)); }, 150);
  })();

  function openChatRoomListModal(rooms) {
    var old = document.getElementById("mpChatListOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.id = "mpChatListOverlay";
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:4000;display:flex;align-items:flex-end;justify-content:center;";

        '<div style="display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #eee;">' +
          '<span style="font-size:15px;font-weight:700;color:#B4863F;display:inline-flex;align-items:center;gap:5px;">' + Icons.messageCircle(17) + '<span>채팅 목록</span></span>' +

  function renderFavRow(t, alertKeys){
    var name = (t.building_name && String(t.building_name).length) ? t.building_name : "이름 미상 단지";
    var addr = t.address || "";
    var bid = (t.building_id != null) ? String(t.building_id) : "";
    var dataName = (t.building_name == null) ? "" : t.building_name;
    var clickable = bid ? "cursor:pointer;" : "cursor:default;";

  function loadMyFavorites(){
    var box = document.getElementById("myFavList");
    if (!box) return;
    Promise.all([
      fetch("/api/favorites/mine", { credentials: "same-origin" }).then(function(r){ return r.json(); }),
      fetch("/api/alerts/mine",    { credentials: "same-origin" }).then(function(r){ return r.json(); }).catch(function(){ return { ok: false, keys: [] }; })
    ]).then(function(results){
      var d = results[0], ad = results[1];
      if (!d || !d.ok){ box.innerHTML = favEmptyHtml("관심단지를 불러오지 못했습니다."); return; }
      var items = d.items || [];
      var alertKeys = new Set((ad && ad.keys) || []);
      if (!items.length){ box.innerHTML = favEmptyHtml("저장된 관심단지가 없습니다."); return; }
      box.innerHTML = items.map(function(t){ return renderFavRow(t, alertKeys); }).join("");
      Array.prototype.forEach.call(box.querySelectorAll(".myfav-item"), function(row){
        row.addEventListener("click", function(){
          var bid = row.getAttribute("data-bid");
          if (bid) window.location.href = "/building/" + bid;
        });
      });
      Array.prototype.forEach.call(box.querySelectorAll(".myfav-remove"), function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          removeMyFavorite(btn.getAttribute("data-name"), btn.getAttribute("data-addr"), btn);
        });
      });
      Array.prototype.forEach.call(box.querySelectorAll(".myfav-signal-btn"), function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          var enabled = btn.getAttribute("data-enabled") === "true";
          btn.disabled = true;
          btn.textContent = "처리 중…";
          fetch("/api/favorites/mine/signal-alert", {
            method: enabled ? "DELETE" : "PUT", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              favorite_id: btn.getAttribute("data-favorite-id"),
              building_id: btn.getAttribute("data-bid")
            })
          }).then(function(r){ return r.json(); })
            .then(function(j){
              if (j && j.ok) loadMyFavorites();
              else {
                btn.disabled = false;
                btn.textContent = enabled ? "숙박알리미 켜짐" : "숙박알리미 받기";
              }
            }).catch(function(){
              btn.disabled = false;
              btn.textContent = enabled ? "숙박알리미 켜짐" : "숙박알리미 받기";
            });
        });
      });
      Array.prototype.forEach.call(box.querySelectorAll(".myfav-map-btn"), function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          window.location.href = "/building/" + btn.getAttribute("data-bid");
        });
      });
      Array.prototype.forEach.call(box.querySelectorAll(".myfav-share-btn"), function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          var url = window.location.origin + "/building/" + btn.getAttribute("data-bid");
          var done = function(){ btn.textContent = "링크 복사됨"; setTimeout(function(){ btn.innerHTML = Icons.share(14) + " 공유"; }, 1400); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done).catch(function(){ window.prompt("링크를 복사하세요", url); });
          } else { window.prompt("링크를 복사하세요", url); }
        });
      });
      Array.prototype.forEach.call(box.querySelectorAll(".myfav-listing-btn"), function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          if (typeof window.openListingRequestModal === "function") {
            window.openListingRequestModal(btn.getAttribute("data-bid"), btn.getAttribute("data-bname"));
          }
        });
      });
    }).catch(function(){ box.innerHTML = favEmptyHtml("네트워크 오류가 발생했습니다."); });
  }

      '<div id="mpLrForm">' +
        '<div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:5px;">거래 유형</div>' +
        '<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">' +
          DEAL_TYPES.map(function(dt){ return '<button class="mpLrDealBtn" data-dt="' + dt + '" style="padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--line,#E2DDD8);background:' + (dt===(prefill.deal_type||"매매")?"var(--brass,#B4863F)":"#fff") + ';color:' + (dt===(prefill.deal_type||"매매")?"#fff":"var(--ink)") + ';">' + dt + '</button>'; }).join("") +
        '</div>' +
        '<div id="mpLrPriceSale">' +
          '<input id="mpLrSalePrice" type="number" min="1" inputmode="numeric" placeholder="매매가 (만원)" style="' + FLD + 'margin-bottom:12px;" value="' + (prefill.price_krw||"") + '" />' +
        '</div>' +
        '<div id="mpLrPriceJeonse" style="display:none;">' +
          '<input id="mpLrJeonseDeposit" type="number" min="1" inputmode="numeric" placeholder="보증금 (만원)" style="' + FLD + 'margin-bottom:12px;" value="' + (prefill.price_krw||"") + '" />' +
        '</div>' +
        '<div id="mpLrPriceWolse" style="display:none;gap:6px;margin-bottom:12px;">' +
          '<input id="mpLrWolseDeposit" type="number" min="1" inputmode="numeric" placeholder="보증금 (만원)" style="' + FLD + 'flex:1;" value="' + (prefill.price_krw||"") + '" />' +
          '<input id="mpLrWolseRent" type="number" min="1" inputmode="numeric" placeholder="월세 (만원)" style="' + FLD + 'flex:1;" value="' + (prefill.monthly_rent_krw||"") + '" />' +
        '</div>' +
        '<input id="mpLrPhone" type="tel" placeholder="연락처 (예: 010-1234-5678)" style="' + FLD + 'margin-bottom:14px;" value="' + escapeHtml(prefill.contact_phone||"") + '" />' +
        '<div id="mpLrMsg" style="font-size:12px;color:#c00;margin-bottom:8px;display:none;"></div>' +
        '<button id="mpLrSubmit" style="width:100%;padding:12px;border-radius:8px;background:var(--brass,#B4863F);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;">' + (isEdit?"저장":"매물의뢰 접수하기") + '</button>' +
      '</div>' +
      '<div id="mpLrDone" style="display:none;text-align:center;padding:18px 0;">' +
        '<div style="font-size:16px;font-weight:700;margin-bottom:8px;">' + (isEdit?"수정됐습니다 ✓":"접수됐습니다 ✓") + '</div>' +

    document.body.appendChild(ov);
    // 연락처 입력창 자동 하이픈 (UX 전용)
    (function(){
      var _ph = document.getElementById("mpLrPhone");
      if (!_ph) return;
      _ph.addEventListener("input", function(){
        var d = this.value.replace(/\D/g, "").slice(0, 11);
        var f = d;
        if (d.length > 7) f = d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
        else if (d.length > 3) f = d.slice(0,3)+"-"+d.slice(3);
        this.value = f;
      });

      });
    });

      var priceKrw = null, rentKrw = null;
      if (curDeal==="매매") priceKrw = parseInt(document.getElementById("mpLrSalePrice").value)||null;
      if (curDeal==="전세") priceKrw = parseInt(document.getElementById("mpLrJeonseDeposit").value)||null;

      if (!phone){ msg.textContent="연락처를 입력해주세요."; msg.style.display="block"; return; }
      msg.style.display="none";
      var submitBtn = document.getElementById("mpLrSubmit");
      submitBtn.disabled=true; submitBtn.textContent="처리 중…";

        ? { deal_type: curDeal, price_krw: priceKrw, monthly_rent_krw: rentKrw, contact_phone: phone }
        : { master_building_id: parseInt(buildingId), deal_type: curDeal, price_krw: priceKrw, monthly_rent_krw: rentKrw, contact_phone: phone };

      fetch(url, { method: method, credentials: "same-origin",

        .then(function(r){ return r.json(); })
        .then(function(j){

            msg.textContent=(j&&j.message)||"오류가 발생했습니다."; msg.style.display="block";
          }
        }).catch(function(){ submitBtn.disabled=false; submitBtn.textContent=(isEdit?"저장":"매물의뢰 접수하기"); msg.textContent="네트워크 오류"; msg.style.display="block"; });
    };
  }
  function removeMyFavorite(name, addr, btn){
    if (btn) btn.disabled = true;
    fetch("/api/favorites/mine", {
      method: "DELETE", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ building_name: name || null, address: addr })
    })
      .then(function(){
        try {
          var keys = JSON.parse(localStorage.getItem("livingstay_favorites") || "[]");
          var k = (name && name.length ? name : "null") + "|" + addr;
          if (Array.isArray(keys)){
            keys = keys.filter(function(x){ return x !== k; });
            localStorage.setItem("livingstay_favorites", JSON.stringify(keys));
          }
        } catch(e){}
        loadMyFavorites();
      })
      .catch(function(){ if (btn) btn.disabled = false; });
  }

  function doSaveName(){

      body: JSON.stringify({ name: name })
    })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        btn.disabled = false;
        if (res.ok && res.j.ok){
          showMsg("nameMsg", "이름이 변경되었습니다.", true);
          var pn = document.getElementById("profileName");
          if (pn) pn.textContent = res.j.name;
        } else {
          showMsg("nameMsg", (res.j && res.j.message) || "변경에 실패했습니다.", false);
        }
      })
      .catch(function(){ btn.disabled = false; showMsg("nameMsg", "네트워크 오류가 발생했습니다.", false); });
  }

    chk.disabled = true;
    fetch("/api/auth/email-alert", {
      method: "PUT", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enabled: enabled })
    })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        chk.disabled = false;
        if (res.ok && res.j.ok){
          showMsg("emailAlertMsg", enabled ? "알림 켜짐" : "알림 꺼짐", true);
          setTimeout(function(){ showMsg("emailAlertMsg", "", true); }, 2500);
        } else {
          chk.checked = !enabled;
          showMsg("emailAlertMsg", (res.j && res.j.message) || "변경 실패", false);
        }
      })
      .catch(function(){
        chk.disabled = false;
        chk.checked = !enabled;
        showMsg("emailAlertMsg", "오류", false);
      });

    fetch("/api/auth/password", {
      method: "PUT", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_password: cur, new_password: nw })
    })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        btn.disabled = false;
        if (res.ok && res.j.ok){
          showMsg("pwMsg", "비밀번호가 변경되었습니다.", true);
          document.getElementById("curPw").value = "";
          document.getElementById("newPw").value = "";
        } else {
          showMsg("pwMsg", (res.j && res.j.message) || "변경에 실패했습니다.", false);
        }
      })
      .catch(function(){ btn.disabled = false; showMsg("pwMsg", "네트워크 오류가 발생했습니다.", false); });
  }

  // ── 회원탈퇴 ─────────────────────────────────────────────────────────────
  function openWithdrawModal(){
    var overlay = document.createElement("div");
    overlay.id = "withdrawOverlay";
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;";
    overlay.innerHTML =
      '<div style="background:#fff; border-radius:14px; max-width:360px; width:100%; padding:26px 22px; box-shadow:0 12px 40px rgba(0,0,0,.25);">' +
        '<div style="font-size:16px; font-weight:700; color:var(--ink); margin-bottom:10px;">회원탈퇴</div>' +
        '<div style="font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:20px;">정말 탈퇴하시겠습니까?<br>이 작업은 되돌릴 수 없습니다.</div>' +
        '<div id="withdrawMsg" style="font-size:12.5px; color:var(--brick); min-height:16px; margin-bottom:8px;"></div>' +
        '<div style="display:flex; gap:10px;">' +
          '<button id="withdrawCancel" style="flex:1; padding:11px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; cursor:pointer;">취소</button>' +
          '<button id="withdrawConfirm" style="flex:1; padding:11px; background:var(--brick); color:#fff; border:none; border-radius:8px; font-size:14px; font-family:inherit; cursor:pointer;">탈퇴하기</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) closeWithdrawModal(); });
    document.getElementById("withdrawCancel").addEventListener("click", closeWithdrawModal);
    document.getElementById("withdrawConfirm").addEventListener("click", doWithdraw);
  }
  function closeWithdrawModal(){
    var o = document.getElementById("withdrawOverlay");
    if (o) o.parentNode.removeChild(o);
  }
  function doWithdraw(){
    var btn = document.getElementById("withdrawConfirm");
    btn.disabled = true;
    fetch("/api/auth/me", { method: "DELETE", credentials: "same-origin" })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if (res.ok && res.j.ok){
          alert("회원탈퇴가 완료되었습니다. 이용해 주셔서 감사합니다.");
          window.location.href = "/";
        } else {
          btn.disabled = false;
          var m = document.getElementById("withdrawMsg");
          if (m) m.textContent = (res.j && res.j.message) || "탈퇴에 실패했습니다.";
        }
      })
      .catch(function(){
        btn.disabled = false;
        var m = document.getElementById("withdrawMsg");
        if (m) m.textContent = "네트워크 오류가 발생했습니다.";
      });
  }

  // ── 로그아웃 ─────────────────────────────────────────────────────────────
  function doLogout(){
    var btn = document.getElementById("logoutBtn");
    if (btn) btn.disabled = true;
    fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" })
      .then(function(){ window.location.href = "/"; })
      .catch(function(){ window.location.href = "/"; });
  }

  // ── 비로그인 ─────────────────────────────────────────────────────────────
  function renderLoggedOut(){
    document.getElementById("myLoading").innerHTML =
      '<div style="text-align:center; padding:36px 12px;">' +
        '<div style="font-size:40px; margin-bottom:12px;">🔒</div>' +
        '<div style="font-size:15px; font-weight:600; color:var(--ink); margin-bottom:6px;">로그인이 필요합니다.</div>' +
        '<div style="font-size:13px; color:var(--ink-soft); margin-bottom:20px;">마이페이지는 로그인 후 이용하실 수 있습니다.</div>' +
        '<a href="/?login=1" class="side-more" style="display:inline-block; width:auto; margin-top:0; padding:10px 28px; text-decoration:none;">로그인하러 가기</a>' +
      '</div>';
  }

  // ── 계정 유형 분기 ────────────────────────────────────────────────────────
  var _BIZ_REDIRECT = {
    agent:           "/agent/dashboard",
    operator:        "/operator/dashboard",
    loan_consultant: "/loan-consultant/dashboard",
  };

  fetch("/api/auth/me", { credentials: "same-origin" })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.logged_in){
        window.location.href = "/?login=1";
        return;
      }
      if (_BIZ_REDIRECT[d.account_type]){
        window.location.href = _BIZ_REDIRECT[d.account_type];
        return;
      }
      // 채팅 모달의 내/상대 말풍선 구분에 사용
      window._livingstayUserId = d.id;
      renderLoggedIn(d);
    })
    .catch(function(){ renderLoggedOut(); });
</script>
