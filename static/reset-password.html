<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 | 홈앤스테이</title>
  <style>
    :root{--ink:#16202E;--soft:#687381;--brass:#B4863F;--line:#e5e8ec}
    *{box-sizing:border-box}
    body{margin:0;background:#f7f6f2;color:var(--ink);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 28px;box-shadow:0 10px 32px rgba(22,32,46,.08)}
    .brand{text-align:center;font-size:12px;font-weight:700;letter-spacing:.14em;margin-bottom:10px}
    h1{text-align:center;font-size:22px;margin:0 0 10px}
    .intro{text-align:center;color:var(--soft);font-size:13px;line-height:1.6;margin:0 0 24px}
    label{display:block;color:var(--soft);font-size:12px;font-weight:700;margin:0 0 7px}
    input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;margin-bottom:14px}
    input:focus{outline:2px solid #f0e2ca;border-color:var(--brass)}
    button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--ink);color:#fff;font:600 14px inherit;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .message{display:none;padding:11px 12px;border-radius:8px;font-size:13px;line-height:1.55;margin-bottom:16px}
    .message.error{display:block;background:#fdecec;color:#b4231f;border:1px solid #f5c6c4}
    .message.success{display:block;background:#edf8f2;color:#216e4e;border:1px solid #b8e1ca}
    .back{display:block;text-align:center;margin-top:18px;color:var(--brass);font-size:12.5px;text-decoration:none}
    .back:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="resetTitle">
      <div class="brand">HOME &amp; STAY</div>
      <h1 id="resetTitle">비밀번호 재설정</h1>
      <p class="intro" id="resetIntro">새로 사용할 비밀번호를 입력해주세요.<br>비밀번호는 8자 이상이어야 합니다.</p>
      <div id="resetMessage" class="message" role="alert"></div>
      <form id="resetForm">
        <label for="newPassword">새 비밀번호</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirmPassword">새 비밀번호 확인</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button type="submit" id="resetSubmit">비밀번호 변경하기</button>
      </form>
      <a class="back" href="/?login=1">로그인 화면으로 돌아가기</a>
    </section>
  </main>
  <script>
    (function () {
      "use strict";
      var form = document.getElementById("resetForm");
      var newPassword = document.getElementById("newPassword");
      var confirmPassword = document.getElementById("confirmPassword");
      var submit = document.getElementById("resetSubmit");
      var message = document.getElementById("resetMessage");
      var intro = document.getElementById("resetIntro");
      var token = "";
      try { token = new URLSearchParams(window.location.search).get("token") || ""; } catch (e) {}

      function showMessage(text, kind) {
        message.textContent = text;
        message.className = "message " + kind;
      }
      function showInvalid() {
        form.style.display = "none";
        intro.textContent = "이 재설정 링크는 만료되었거나 이미 사용되었습니다.";
        showMessage("새 링크가 필요합니다. 로그인 화면에서 비밀번호 찾기를 다시 요청해주세요.", "error");
      }
      if (!token) showInvalid();

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!token) return;
        var password = newPassword.value || "";
        var confirmation = confirmPassword.value || "";
        if (password.length < 8) {
          showMessage("비밀번호는 8자 이상이어야 합니다.", "error");
          return;
        }
        if (password !== confirmation) {
          showMessage("새 비밀번호와 확인값이 일치하지 않습니다.", "error");
          return;
        }
        submit.disabled = true;
        showMessage("", "success");
        fetch("/api/auth/reset-password", {
          method: "POST",
          credentials: "same-origin",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({token: token, new_password: password})
        })
          .then(function (response) {
            return response.json().then(function (data) { return {ok: response.ok, data: data}; });
          })
          .then(function (result) {
            if (result.ok && result.data && result.data.ok) {
              form.style.display = "none";
              intro.textContent = "비밀번호가 안전하게 변경되었습니다.";
              showMessage("새 비밀번호로 로그인해주세요.", "success");
            } else {
              showMessage((result.data && result.data.message) || "비밀번호를 변경하지 못했습니다.", "error");
              if (result.data && result.data.message && result.data.message.indexOf("재설정 링크") >= 0) form.style.display = "none";
            }
          })
          .catch(function () { showMessage("네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.", "error"); })
          .finally(function () { submit.disabled = false; });
      });
    }());
  </script>
</body>
</html>
