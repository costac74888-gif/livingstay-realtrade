<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>숙박시설은 홈앤스테이</title>
<link rel="icon" href="/static/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <div class="admin-login-brand">HOME &amp; STAY</div>
      <h1 class="admin-login-title">대출상담사 로그인</h1>
      <p class="admin-login-sub">일반회원과 파트너는 같은 비밀번호를 사용합니다. 가입한 이메일과 비밀번호를 입력하세요.</p>
      <form id="loginForm" class="admin-login-form" autocomplete="off">
        <input
          id="lcEmail"
          type="text"
          class="admin-input"
          placeholder="아이디(이메일)"
          autocomplete="username"
          required
        />
        <input
          id="lcPassword"
          type="password"
          class="admin-input"
          placeholder="비밀번호"
          autocomplete="current-password"
          required
        />
        <label class="agent-remember" for="rememberLogin">
          <input id="rememberLogin" type="checkbox" />
          <span>로그인 상태 유지 (31일)</span>
        </label>
        <button type="submit" class="admin-btn admin-btn-primary" id="loginBtn">로그인</button>
      </form>
      <div id="loginMsg" class="admin-login-msg" role="status" aria-live="polite" hidden></div>
      <div id="contextPicker" class="agent-context-picker" hidden></div>
      <div class="agent-login-links">
        <a href="/?login=general">일반회원 로그인</a>
        <a href="/?login=reset">비밀번호 재설정</a>
        <a href="/partner/login">파트너 통합 로그인</a>
      </div>
    </div>
  </div>

  <script src="/static/js/partner_login.js"></script>
  <script src="/static/js/pw_toggle.js"></script>
</body>
</html>
