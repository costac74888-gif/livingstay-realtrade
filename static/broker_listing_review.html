<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>중개 매물 검수 · 홈앤스테이</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body{background:#f4f5f6}.review-page{max-width:1040px;margin:30px auto;padding:0 18px 56px;color:var(--ink,#202a35)}
    .review-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}
    .review-head h1{font-size:24px;margin:0}.review-head p{margin:5px 0 0;color:var(--ink-soft)}
    .review-card{padding:18px;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:#fff}
    .review-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .review-card h2{margin:0 0 7px;font-size:17px}.review-meta{color:var(--ink-soft);font-size:13px;line-height:1.7}
    .review-status{flex:none;border-radius:999px;padding:5px 10px;background:#f4ead8;color:#805724;font-size:11px;font-weight:800}
    .review-status-approved{background:#edf5ea;color:#42613a}.review-status-rejected{background:#f8e9e6;color:#91483e}
    .review-reason{margin-top:10px;padding:9px 11px;background:#f8f4ed;border-radius:8px;font-size:12px;line-height:1.5}
    .review-section{margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
    .review-section h3{margin:0 0 9px;font-size:13px}
    .review-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
    .review-fact{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #f2f0ed;font-size:12px}
    .review-fact span{color:var(--ink-soft)}.review-fact b{text-align:right;overflow-wrap:anywhere}
    .review-description{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0;padding:11px;border-radius:8px;background:#f7f8f8;font-size:12px;line-height:1.65}
    .review-photos{display:flex;gap:8px;overflow-x:auto}.review-photos img{width:112px;height:86px;object-fit:cover;border-radius:7px}
    .review-muted{color:var(--ink-soft);font-size:12px}
    .review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .review-actions button{padding:9px 14px;border:0;border-radius:7px;background:#1f4d87;color:#fff;font:700 13px inherit;cursor:pointer}
    .review-actions .reject{background:#8c443b}.review-actions textarea{flex:1 1 250px;min-height:40px;border:1px solid var(--line);border-radius:7px;padding:9px;font:13px inherit}
    .review-state{padding:36px 18px;text-align:center;color:var(--ink-soft);background:#fff;border-radius:12px}
    @media(max-width:600px){.review-page{margin:18px auto}.review-head{align-items:start;flex-direction:column}.review-actions textarea{flex-basis:100%}.review-card-head{flex-direction:column}.review-facts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header id="siteHeader"></header>
  <main class="review-page">
    <div class="review-head"><div><h1>중개 매물 검수</h1><p>중개사 등록 정보와 표시·광고 항목을 확인한 뒤 게시 여부를 결정합니다.</p></div><button id="reviewReload" type="button">새로고침</button></div>
    <div id="reviewList" class="review-state" aria-live="polite">검수 대기 매물을 불러오는 중입니다.</div>
  </main>
  <script src="/static/js/header.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/broker_listing_review.js"></script>
</body>
</html>
