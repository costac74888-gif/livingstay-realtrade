<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수신거부 완료 — 홈앤스테이</title>
<link rel="stylesheet" href="/static/css/style.css?v=1">
<style>
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
         min-height:100vh; margin:0; background:#f4f5f7;
         font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  .card { background:#fff; border-radius:14px; box-shadow:0 4px 24px rgba(0,0,0,.08);
          padding:44px 36px; max-width:400px; width:90%; text-align:center; }
  .icon { font-size:40px; margin-bottom:16px; }
  h1 { font-size:20px; font-weight:800; color:#16202E; margin:0 0 10px; }
  p  { font-size:14px; color:#666; line-height:1.65; margin:0 0 24px; }
  .btn { display:inline-block; background:#B4863F; color:#fff; text-decoration:none;
         padding:11px 26px; border-radius:8px; font-size:14px; font-weight:700; }
  .link { display:block; margin-top:14px; font-size:13px; color:#aaa; text-decoration:none; }
  .link:hover { color:#B4863F; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>수신거부가 완료되었습니다</h1>
    <p>주간 소식 이메일이 더 이상 발송되지 않습니다.<br>
       다시 받아보시려면 마이페이지 → 관심단지 탭에서<br>
       <b>주간 소식 이메일 받기</b>를 켜주세요.</p>
    <a class="btn" href="/">홈으로 돌아가기</a>
    <a class="link" href="/mypage">마이페이지에서 설정 변경 →</a>
  </div>
</body>
</html>
