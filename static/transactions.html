<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>숙박시설 실거래가 &amp; 위탁운영 플랫폼 . 홈앤스테이</title>
<meta name="description" content="전국 생활숙박시설·분양형호텔·콘도 실거래가 전체 목록. 지역·용도·기간별 검색." />
<link rel="icon" href="/static/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>

<header id="siteHeader"></header>

<div class="tx-page">

  <div class="tx-filter">
    <div class="tx-filter-grid">
      <div class="field">
        <label>시/도</label>
        <select id="selSiDo"><option value="">전체</option></select>
      </div>
      <div class="field">
        <label>시/군/구</label>
        <select id="selSggNm"><option value="">전체</option></select>
      </div>
      <div class="field">
        <label>읍/면/동</label>
        <select id="selUmdNm"><option value="">전체</option></select>
      </div>
      <div class="field">
        <label>건물명 / 주소 검색</label>
        <input type="text" id="inputQ" placeholder="예) 오션마크레지던스" />
      </div>
      <div class="field">
        <label>용도</label>
        <select id="selLodgingType">
          <option value="" selected>전체</option>
          <option value="생활">생활</option>
          <option value="관광">관광</option>
          <option value="일반">일반</option>
          <option value="복합">복합</option>
          <option value="미분류">미분류</option>
        </select>
      </div>
      <div class="field">
        <label>검색기간</label>
        <select id="selYear"></select>
      </div>
      <button class="btn-search" id="btnSearch">검색</button>
    </div>
    <div class="tx-favbar">
      <label><input type="checkbox" id="chkFavOnly"> 관심단지만 보기</label>
      <span id="favCountLabel"></span>
      <div id="favChips" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>
  </div>

  <div class="results-head" style="margin-top:18px;">
    <h2>실거래 목록<span class="count" id="resultCount"></span></h2>
  </div>
  <div id="board"><div class="loading">불러오는 중…</div></div>
  <div class="pager" id="pager"></div>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-col">
      <img src="/static/home_stay_footer_logo.png" alt="HOME &amp; STAY" class="footer-logo-img">
      <p class="footer-desc">전국 숙박시설 실거래가 조회 서비스</p>
    </div>
    <div class="footer-col footer-meta">
      <p>데이터 출처 · 국토교통부 실거래가 공개시스템(매매만 제공), 건축물대장</p>
      <p>실거래가 정보는 참고용이며, 실제 거래 시 반드시 원문 자료를 확인하시기 바랍니다.</p>
      <p class="footer-copy">© 2026 홈앤스테이 (HOME &amp; STAY). All rights reserved.</p>
    </div>
  </div>
</footer>

<style>
  .tx-page{ max-width:1240px; margin:0 auto 60px; padding:0 20px; }
  .tx-filter{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .tx-filter-grid{ display:grid; grid-template-columns:repeat(6, 1fr) auto; gap:12px; align-items:end; }
  .tx-filter-grid .field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .tx-filter-grid .field label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .tx-filter-grid .field select,
  .tx-filter-grid .field input{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:13px; font-family:inherit; box-sizing:border-box; background:#fff; color:var(--ink);
  }
  .tx-filter-grid .btn-search{
    background:var(--brass); color:#fff; border:none; border-radius:8px;
    padding:10px 22px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .tx-filter-grid .btn-search:hover{ background:var(--brass-dark); }
  .tx-favbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-soft); }
  .tx-favbar label{ display:flex; align-items:center; gap:5px; cursor:pointer; font-weight:600; color:var(--ink); white-space:nowrap; }
  .clickable-row{ cursor:pointer; }
  .clickable-row:hover{ background:var(--bg-soft, #f6f4ef); }
  .clickable-row .row-link{ color:inherit; text-decoration:none; }
  .clickable-row:hover .row-link{ color:var(--brass-dark); text-decoration:underline; }
  @media (max-width: 900px){
    .tx-filter-grid{ grid-template-columns:1fr 1fr; }
    .tx-filter-grid .btn-search{ grid-column:1 / -1; }
  }
  @media (max-width: 520px){
    /* 좁은 폰: 필터를 한 줄에 하나씩 — 셀렉트가 눌리지 않게 */
    .tx-filter-grid{ grid-template-columns:1fr; }
  }
</style>

<script>
  let regionTree = {};
  const FAV_KEY = "livingstay_favorites"; // 마이그레이션 호환용 — 직접 쓰기는 하지 않음
  const state = { si_do:"", sgg_nm:"", umd_nm:"", q:"", year:"all", lodging_type:"", page:1, size:20, favOnly:false, favKey:null };

  // 로그인 회원의 관심키(building_name|address) 인메모리 캐시
  // 비로그인 → 항상 빈 Set
  let serverFavKeys = new Set();
  function getFavorites(){ return [...serverFavKeys]; }

  async function loadServerFavKeys(){
    serverFavKeys = new Set();
    if (!window.__livingstayLoggedIn) return;
    try {
      const res = await fetch("/api/favorites/mine", { credentials: "same-origin" });
      const data = await res.json();
      (data.items || []).forEach(item => serverFavKeys.add(`${item.building_name}|${item.address}`));
    } catch(e) {}
  }

  function promptLogin(msg){
    if (msg) alert(msg);
    if (typeof window.livingstayOpenLogin === "function") window.livingstayOpenLogin();
    else location.href = "/?login=1";
  }

  function escapeHtml(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  async function loadRegions(){
    const res = await fetch("/api/regions");
    regionTree = await res.json();
    const selSiDo = document.getElementById("selSiDo");
    selSiDo.innerHTML = '<option value="">전체</option>' +
      Object.keys(regionTree).sort().map(sd => `<option value="${escapeHtml(sd)}">${escapeHtml(sd)} (${regionTree[sd].count})</option>`).join("");
  }
  function refreshSggOptions(){
    const selSggNm = document.getElementById("selSggNm");
    const selUmdNm = document.getElementById("selUmdNm");
    if (!state.si_do || !regionTree[state.si_do]){
      selSggNm.innerHTML = '<option value="">전체</option>';
      selUmdNm.innerHTML = '<option value="">전체</option>';
      return;
    }
    const sggMap = regionTree[state.si_do].sgg;
    selSggNm.innerHTML = '<option value="">전체</option>' +
      Object.keys(sggMap).sort().map(sg => `<option value="${escapeHtml(sg)}">${escapeHtml(sg)} (${sggMap[sg].count})</option>`).join("");
    selUmdNm.innerHTML = '<option value="">전체</option>';
  }
  function refreshUmdOptions(){
    const selUmdNm = document.getElementById("selUmdNm");
    const sgg = regionTree[state.si_do] && regionTree[state.si_do].sgg[state.sgg_nm];
    if (!sgg){
      selUmdNm.innerHTML = '<option value="">전체</option>';
      return;
    }
    const umdMap = sgg.umd;
    selUmdNm.innerHTML = '<option value="">전체</option>' +
      Object.keys(umdMap).sort().map(um => `<option value="${escapeHtml(um)}">${escapeHtml(um)} (${umdMap[um]})</option>`).join("");
  }

  async function loadYears(){
    const res = await fetch("/api/years");
    const data = await res.json();
    const sel = document.getElementById("selYear");
    const opts = ['<option value="all">전체 기간</option>'];
    data.years.forEach(y => opts.push(`<option value="${y}">${y}년</option>`));
    sel.innerHTML = opts.join("");
    sel.value = "all";
    state.year = "all";
  }

  function rowHTML(t){
    const typeTag = t.deal_type === "직거래"
      ? `<span class="tag brk">직거래</span>`
      : `<span class="tag med">중개거래</span>`;
    // static/js/main.js의 LODGING_COLORS와 반드시 동일하게 유지
    const LODGING_COLORS = { "생활": "#378ADD", "관광": "#639922", "일반": "#D46BA3", "복합": "#B39DDB", "미분류": "#BDBDBD" };
    const isCombined = (t.lodging_type || "").includes("·");
    const lodgingLabel = isCombined ? "복합" : (t.lodging_type || "미분류");
    const lodgingColor = LODGING_COLORS[lodgingLabel] || LODGING_COLORS["미분류"];
    const lodgingTag = `<span style="display:inline-block; font-size:10.5px; font-weight:700; color:#fff; background:${lodgingColor}; padding:2px 8px; border-radius:5px;">${escapeHtml(lodgingLabel)}</span>`;
    const priceFormatted = Number(t.price || 0).toLocaleString('ko-KR');
    const nameText = t.building_name != null ? escapeHtml(t.building_name) : "(건물명 미확인)";
    // master_building_id가 있으면 건물 상세 페이지로 이동하는 일반 링크(<a href>)로 만든다.
    const mbid = t.master_building_id;
    const clickable = mbid != null && mbid !== "";
    const href = clickable ? `/building/${Number(mbid)}` : null;
    const nameCell = clickable
      ? `<a href="${href}" class="row-link" onclick="event.stopPropagation()">${nameText}</a> ${lodgingTag}`
      : `${nameText} ${lodgingTag}`;
    const trAttrs = clickable ? ` class="clickable-row" onclick="location.href='${href}'"` : "";
    return `
      <tr${trAttrs}>
        <td class="col-name">${nameCell}</td>
        <td class="col-addr">${escapeHtml(t.si_do||'')} ${escapeHtml(t.sgg_nm||'')} ${escapeHtml(t.umd_nm||'')} ${escapeHtml(t.jibun||'')}</td>
        <td class="col-num col-area">${Number(t.area).toFixed(1)} ㎡</td>
        <td class="col-num col-floor">${t.floor ? escapeHtml(t.floor) + '<span class="m-only">층</span>' : '-'}</td>
        <td class="col-price">${priceFormatted}<span class="m-only">만원</span></td>
        <td class="col-date">${escapeHtml(t.deal_date||'')}</td>
        <td class="col-type">${typeTag}</td>
      </tr>`;
  }

  async function loadBoard(){
    const board = document.getElementById("board");
    board.innerHTML = `<div class="loading">불러오는 중…</div>`;

    let items = [], total = 0;
    try {
      if (state.favOnly){
        // 관심단지만 보기 — localStorage 관심키 전체를 /api/favorites로 한 번에 조회.
        // (지도 홈과 동일 방식: 관심 전체를 한 화면에 표시 → 페이지네이션과 자연스럽게 맞물림)
        const favs = getFavorites();
        if (favs.length === 0){
          items = []; total = 0;
        } else {
          const res = await fetch(`/api/favorites?keys=${encodeURIComponent(favs.join(","))}`);
          const data = await res.json();
          items = data.items || []; total = data.total || 0;
        }
      } else {
        const params = new URLSearchParams({
          q: state.q, si_do: state.si_do, sgg_nm: state.sgg_nm, umd_nm: state.umd_nm,
          year: state.year, lodging_type: state.lodging_type, page: state.page, size: state.size,
          with_total: 1
        });
        const res = await fetch(`/api/transactions?${params}`);
        const data = await res.json();
        items = data.items || []; total = data.total || 0;
      }
    } catch (e) {
      board.innerHTML = `<div class="empty-state"><div class="big">목록을 불러오지 못했습니다</div>잠시 후 다시 시도해주세요.</div>`;
      document.getElementById("pager").innerHTML = "";
      return;
    }

    document.getElementById("resultCount").textContent = `총 ${total.toLocaleString('ko-KR')}건`;

    if (items.length === 0){
      board.innerHTML = state.favOnly
        ? `<div class="empty-state"><div class="big">저장된 관심단지 거래가 없습니다</div>목록에서 건물을 관심단지로 추가해보세요.</div>`
        : `<div class="empty-state"><div class="big">일치하는 거래가 없습니다</div>검색 조건을 조정해보세요.</div>`;
      document.getElementById("pager").innerHTML = "";
      return;
    }

    board.innerHTML = `
      <table class="data-table">
        <thead><tr><th>건물명</th><th>주소</th><th>면적</th><th>층</th><th>거래금액 (만원)</th><th>계약일</th><th>거래유형</th></tr></thead>
        <tbody>${items.map(rowHTML).join("")}</tbody>
      </table>`;

    const pager = document.getElementById("pager");
    if (state.favOnly){
      pager.innerHTML = "";   // 관심단지 전체를 한 번에 표시 → 페이지네이션 없음
      return;
    }
    const totalPages = Math.max(Math.ceil(total / state.size), 1);
    pager.innerHTML = `
      <button ${state.page<=1?"disabled":""} id="prevPage">이전</button>
      <span class="cur">${state.page} / ${totalPages}</span>
      <button ${state.page>=totalPages?"disabled":""} id="nextPage">다음</button>`;
    const prev = document.getElementById("prevPage");
    const next = document.getElementById("nextPage");
    if (prev) prev.addEventListener("click", ()=>{ state.page--; loadBoard(); window.scrollTo({top:0, behavior:"smooth"}); });
    if (next) next.addEventListener("click", ()=>{ state.page++; loadBoard(); window.scrollTo({top:0, behavior:"smooth"}); });
  }

  function renderFavChips(){
    const wrap = document.getElementById("favChips");
    if (!wrap) return;
    const favs = getFavorites();
    const label = document.getElementById("favCountLabel");
    if (label) label.textContent = favs.length ? `저장된 관심단지 ${favs.length}개` : "저장된 관심단지가 없습니다";
    wrap.innerHTML = "";
    favs.forEach(k => {
      const name = k.split("|")[0];
      const chip = document.createElement("span");
      chip.className = "fav-chip";
      const lbl = document.createElement("span");
      lbl.className = "label";
      lbl.textContent = "★ " + (name && name !== "null" && name !== "undefined" ? name : "(건물명 미확인)");
      lbl.title = "이 건물의 상세 페이지로 이동";
      lbl.addEventListener("click", () => goToFavBuilding(k, chip));
      chip.appendChild(lbl);
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "✕";
      x.addEventListener("click", (e) => { e.stopPropagation(); removeFav(k); });
      chip.appendChild(x);
      wrap.appendChild(chip);
    });
  }

  // 칩 클릭 → 건물 id를 찾아 건물상세(지도 포함) 페이지로 이동.
  // favKey는 "건물명|주소"뿐이라 id가 없으므로 /api/buildings-geo?q=건물명으로 조회 후,
  // 여러 건이면 주소 포함 비교로 고르고, 0건이면 기존 페이지 내 필터링(filterToFav)으로 폴백.
  async function goToFavBuilding(key, chipEl){
    const sep = key.indexOf("|");
    const name = sep >= 0 ? key.slice(0, sep) : key;
    const addr = sep >= 0 ? key.slice(sep + 1) : "";
    if (!name || name === "null" || name === "undefined") { filterToFav(key); return; }
    if (chipEl) chipEl.style.cursor = "progress";
    let items = [];
    try {
      const res = await fetch("/api/buildings-geo?q=" + encodeURIComponent(name));
      const data = await res.json();
      items = data.items || data.buildings || (Array.isArray(data) ? data : []);
    } catch (e) { items = []; }
    if (chipEl) chipEl.style.cursor = "";
    let picked = null;
    if (items.length === 1) {
      picked = items[0];
    } else if (items.length > 1) {
      // 주소 포함 비교: favKey 주소와 후보의 road_address/최근거래 address가 서로 포함 관계면 매칭
      const norm = (s) => String(s || "").replace(/\s+/g, "");
      const a = norm(addr);
      if (a) {
        picked = items.find((b) => {
          const r = norm(b.road_address), t = norm(b.address);
          return (r && (a.includes(r) || r.includes(a))) || (t && (a.includes(t) || t.includes(a)));
        }) || null;
      }
      if (!picked) picked = items[0]; // 주소 매칭 실패 시 첫 번째 후보
    }
    if (picked && picked.id != null) {
      window.location.href = "/building/" + picked.id;
    } else {
      filterToFav(key); // 0건 — 건물 삭제/미매칭 대비 폴백
    }
  }

  // 폴백용: 그 건물명을 검색창에 채워 이 페이지 안에서 필터링.
  function filterToFav(key){
    const name = key.split("|")[0];
    const q = (name && name !== "null" && name !== "undefined") ? name : "";
    const input = document.getElementById("inputQ");
    if (input) input.value = q;
    state.q = q.trim();
    state.favOnly = false;
    state.favKey = null;
    const chk = document.getElementById("chkFavOnly");
    if (chk) chk.checked = false;
    state.page = 1;
    renderFavChips();
    loadBoard();
  }

  function removeFav(key){
    serverFavKeys.delete(key);
    const sep = key.indexOf("|");
    if (sep >= 0){
      fetch("/api/favorites/mine", {
        method: "DELETE", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ building_name: key.slice(0, sep), address: key.slice(sep + 1) })
      }).catch(function(){});
    }
    state.page = 1;
    renderFavChips();
    loadBoard();
  }

  // auth.js가 로그인/migrate 후 호출 → 서버에서 관심키 재로드 후 UI 갱신
  window.refreshFavoritesUI = async function(){
    await loadServerFavKeys();
    renderFavChips();
    if (state.favOnly) loadBoard();
  };
  // livingstay:auth — 이미 로그인 상태로 진입할 때도 관심키 로드
  document.addEventListener("livingstay:auth", async function(){
    await loadServerFavKeys();
    renderFavChips();
    if (state.favOnly) loadBoard();
  });

  document.getElementById("selSiDo").addEventListener("change", e=>{
    state.si_do = e.target.value; state.sgg_nm=""; state.umd_nm="";
    refreshSggOptions();
  });
  document.getElementById("selSggNm").addEventListener("change", e=>{
    state.sgg_nm = e.target.value; state.umd_nm="";
    refreshUmdOptions();
  });
  document.getElementById("selUmdNm").addEventListener("change", e=>{ state.umd_nm = e.target.value; });
  document.getElementById("selYear").addEventListener("change", e=>{ state.year = e.target.value; });
  document.getElementById("selLodgingType").addEventListener("change", e=>{ state.lodging_type = e.target.value; });
  document.getElementById("chkFavOnly").addEventListener("change", e=>{
    state.favOnly = e.target.checked; state.favKey = null; state.page = 1;
    renderFavChips(); loadBoard();
  });

  function runSearch(){
    state.q = document.getElementById("inputQ").value.trim();
    state.page = 1;
    loadBoard();
  }
  document.getElementById("btnSearch").addEventListener("click", runSearch);
  document.getElementById("inputQ").addEventListener("keydown", e=>{ if (e.key === "Enter") runSearch(); });

  (async function init(){
    await loadRegions();
    await loadYears();
    renderFavChips();
    // B패널 "이 건물 전체 실거래 보기"에서 넘어온 경우 ?q= 값으로 자동 검색 1회 실행.
    const urlQ = new URLSearchParams(location.search).get("q");
    if (urlQ){
      const input = document.getElementById("inputQ");
      if (input) input.value = urlQ;
      state.q = urlQ.trim();
    }
    loadBoard();
  })();
</script>
